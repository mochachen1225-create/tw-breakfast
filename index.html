<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>帥哥美女早餐店</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
/* Layout: 一個手機畫面。上 = 點單＋帳本，下 = 廚房（煎台 / 工作台 / 食材 / 飲料）。單一主題：早餐店招牌風 */
:root{
  --cream:#FFF4E0;      /* 牆面 */
  --paper:#FFFDF7;      /* 點單紙 */
  --tomato:#E4572E;     /* 招牌紅 */
  --tomato-dk:#B83E1C;
  --yolk:#F6B93B;       /* 蛋黃 */
  --scallion:#5FA33E;   /* 蔥花綠 */
  --steel:#3A3F47;      /* 煎台/盤子 */
  --steel-dk:#2A2E35;
  --wood:#D9A066;       /* 櫃台、砧板 */
  --wood-dk:#B97F45;
  --ink:#3B2A20;        /* 文字 */
  --ink-soft:#7A6455;
  --display:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{background:var(--cream);color:var(--ink);font-family:var(--body);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
button:focus-visible{outline:3px solid var(--yolk);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column;max-width:520px;margin:0 auto;position:relative;
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));box-sizing:border-box}

/* ---------- 招牌 ---------- */
.hud{flex:0 0 auto;display:flex;align-items:center;gap:8px;background:var(--tomato);color:#fff;
  margin:0 -10px;padding:6px 12px;border-bottom:4px solid var(--tomato-dk)}
.sign{font-family:var(--display);font-size:17px;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;text-shadow:0 2px 0 var(--tomato-dk)}
.stats{margin-left:auto;display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;flex:0 0 auto}
.pill{background:rgba(0,0,0,.18);border-radius:999px;padding:2px 8px;white-space:nowrap}
#timer.hurry{background:var(--yolk);color:var(--ink);animation:pulse .6s infinite alternate}
#lives{letter-spacing:-2px;white-space:nowrap;font-size:13px}
#lives .gone{filter:grayscale(1);opacity:.35}
.rival{flex:0 0 auto;display:flex;gap:10px;align-items:center;justify-content:center;font-size:14px;font-weight:700;background:#2A2420;color:#fff;margin:0 -10px;padding:3px 12px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}
.rival b{color:var(--yolk)}
.rival .off{opacity:.5}
.modes{display:flex;flex-direction:column;gap:10px}
.modeBtn{display:flex;align-items:center;gap:12px;text-align:left;background:var(--paper);border-radius:16px;padding:12px 14px;box-shadow:0 4px 0 #D8C3A5;border:3px solid transparent}
.modeBtn:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C3A5}
.modeBtn .mi{font-size:34px;line-height:1}
.modeBtn b{display:block;font-family:var(--display);font-size:21px;color:var(--tomato)}
.modeBtn small{font-size:12.5px;color:var(--ink-soft)}
.codeIn{font-family:var(--display);font-size:44px;letter-spacing:.35em;text-align:center;width:100%;box-sizing:border-box;background:var(--paper);border:4px solid var(--wood);border-radius:16px;padding:6px 0 6px .35em;color:var(--ink);
  -webkit-user-select:text;user-select:text;touch-action:auto}
.codeIn:focus{outline:none;border-color:var(--tomato)}
.seats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seat{background:var(--paper);border-radius:14px;padding:10px 6px;display:flex;flex-direction:column;gap:4px;align-items:center;min-height:86px;justify-content:center;box-shadow:inset 0 0 0 2px #E2C08D}
.seat .sn{font-family:var(--display);font-size:16px;color:var(--ink);word-break:break-all}
.seat .st{font-size:12px;font-weight:900;border-radius:999px;padding:1px 10px;background:#EDE3D3;color:var(--ink-soft)}
.seat .st.ok{background:var(--scallion);color:#fff}
.seat.empty{box-shadow:inset 0 0 0 2px #E2C08D;opacity:.7}
.seat .you{font-size:11px;color:var(--tomato);font-weight:900}
.countdown{font-family:var(--display);font-size:96px;color:var(--tomato);line-height:1;animation:hop .4s ease-out}
.vsTable{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.vsTable th,.vsTable td{padding:5px 4px;border-bottom:1px dashed #E2C08D}
.vsTable th{font-size:12px;color:var(--ink-soft)}
.vsTable td:first-child{text-align:left;font-weight:700;color:var(--ink-soft)}
.err{color:var(--tomato);font-weight:700;font-size:13px;min-height:1.2em}
.iconbtn{width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.18);font-size:15px;display:grid;place-items:center}

/* ---------- 點單 ---------- */
.front{flex:0 0 auto;display:flex;flex-direction:column;position:relative;padding-top:8px;gap:5px}
.pbar{height:8px;border-radius:4px;background:rgba(59,42,32,.15);overflow:hidden;flex:1}
.pbar i{display:block;height:100%;width:100%;background:var(--scallion);border-radius:4px;transform-origin:left}
.ticket{background:var(--paper);border-radius:6px;box-shadow:0 3px 0 rgba(59,42,32,.15);padding:6px 10px 8px;
  display:flex;flex-direction:column;gap:5px;position:relative;min-height:82px;box-sizing:border-box;
  border-top:6px dashed var(--cream);background-image:repeating-linear-gradient(transparent 0 27px,rgba(228,87,46,.10) 27px 28px)}
.ticket.pop{animation:hop .3s ease-out}
.ticket.mad{animation:shake .3s}
.tk-head{font-family:var(--display);font-size:15px;color:var(--tomato);display:flex;align-items:center;gap:8px}
.tk-head .who{font-size:15px;border-radius:999px;padding:1px 10px;color:#fff;background:var(--scallion)}
.tk-head .who.to{background:var(--yolk);color:var(--ink)}
.tk-head .who.uber{background:#1F1F1F;color:#fff}
.tk-head .who.uber::before{content:"🛵 "}
.tk-head .who.uncle{background:var(--wood);color:var(--ink)}
.tk-head .sum{color:var(--ink);font-variant-numeric:tabular-nums}
.tk-items{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;align-content:start;min-height:76px}
.pager{display:flex;gap:4px;flex:0 0 auto}
.pager button{min-width:32px;height:28px;border-radius:8px;background:var(--paper);box-shadow:inset 0 0 0 2px var(--tomato);color:var(--tomato);font-family:var(--display);font-size:15px;position:relative}
.pager button.on{background:var(--tomato);color:#fff}
.pager button:not(.clear)::after{content:"";position:absolute;right:-3px;top:-3px;width:9px;height:9px;border-radius:50%;background:var(--yolk);box-shadow:0 0 0 2px var(--paper)}
.tk-item{display:flex;align-items:center;gap:6px;font-size:16.5px;min-width:0;font-weight:700;line-height:1.15}
.tk-item .pr{color:var(--ink-soft);font-size:12.5px;margin-left:3px;font-variant-numeric:tabular-nums}
.tk-item small.sg{display:inline-block;border-radius:4px;padding:0 4px;color:var(--ink);box-shadow:inset 0 0 0 1px #E2C08D}
.tk-item small{display:block;font-weight:700;color:var(--tomato-dk);font-size:13.5px}
.tk-item.done{opacity:.4;text-decoration:line-through}
.tk-item.changed{animation:flashBg 1s 3}
.mini{width:34px;height:34px;border-radius:50%;background:var(--steel);display:grid;place-items:center;flex:0 0 auto}
.mini svg{width:28px;height:28px}
.free{position:absolute;right:8px;bottom:6px;transform:rotate(-14deg);border:3px solid var(--tomato);color:var(--tomato);
  font-family:var(--display);font-size:20px;padding:0 6px;border-radius:6px;opacity:.85}
.secret{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:2px;cursor:pointer}
.secret b{font-family:var(--display);font-size:20px;color:var(--tomato)}
.secret small{font-size:11px;color:var(--ink-soft)}
.waiting{margin:auto;color:var(--ink-soft);font-size:13px}
.ledger{display:flex;gap:10px;justify-content:space-between;font-size:14px;font-weight:700;color:var(--ink-soft);font-variant-numeric:tabular-nums;padding:0 2px}
.ledger b{font-size:16px}
.ledger .in b{color:var(--scallion)}
.ledger .out b{color:var(--tomato)}
.ledger .net{background:var(--yolk);color:var(--ink);border-radius:999px;padding:0 10px}
.ledger .net.neg{background:var(--tomato);color:#fff}
.ledger .bump{animation:pulse .15s 2 alternate}

.say{position:absolute;z-index:5;background:#fff;border-radius:12px;padding:5px 10px;font-weight:900;font-size:14px;
  box-shadow:0 3px 0 rgba(59,42,32,.18);white-space:nowrap;pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .15s,transform .15s}
.say.show{opacity:1;transform:none}
#bossSay{right:4px;top:-4px;background:var(--yolk);color:var(--ink)}
#custSay{right:6px;top:30px;background:var(--tomato);color:#fff;max-width:70%;white-space:normal}

/* ---------- 廚房 ---------- */
.kitchen{flex:1 1 auto;display:flex;flex-direction:column;gap:5px;padding:6px 0 max(8px,env(safe-area-inset-bottom,0px));min-height:0}
.grill{flex:1 1 0;min-height:130px;max-height:230px;container-type:size;background:linear-gradient(#4A505A,var(--steel));border-radius:14px;padding:8px;display:grid;
  grid-template-columns:1fr 1fr;grid-template-rows:1fr;gap:14px;place-items:center;
  box-shadow:inset 0 0 0 2px #23272d,0 4px 0 #23272d;position:relative}
.grill.hot{box-shadow:inset 0 0 0 2px #23272d,inset 0 0 22px rgba(246,120,40,.35),0 4px 0 #23272d}
.slot{width:min(calc((100cqw - 30px)/2),calc(100cqh - 20px));height:auto;aspect-ratio:1;min-height:0;position:relative;border-radius:50%;background:var(--steel-dk);display:grid;place-items:center;box-sizing:border-box}
.slot .ring{position:absolute;inset:-3px;border-radius:50%;
  background:conic-gradient(var(--rc,var(--yolk)) calc(var(--p,0)*1turn),transparent 0);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 5px));
          mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 5px))}
.slot .food{width:80%;height:80%;display:grid;place-items:center}
.slot .food svg{width:100%;height:100%;display:block}
.slot.sel{box-shadow:0 0 0 3px var(--paper),0 0 0 6px var(--yolk)}
.slot.ready .food{animation:bob .5s infinite alternate}
.slot.warn .ring{animation:blink .25s infinite alternate}
.slot .empty{color:rgba(255,255,255,.2);font-size:16px;font-weight:700}
.slot .toss{position:absolute;right:4%;top:4%;width:30px;height:30px;border-radius:50%;background:var(--paper);color:var(--ink);font-size:11px;font-weight:900;
  box-shadow:0 2px 0 rgba(0,0,0,.3);display:none;place-items:center}
.slot.has .toss{display:grid}
.slot .smoke{position:absolute;inset:0;pointer-events:none}
.slot .smoke.on::before,.slot .smoke.on::after{content:"💨";position:absolute;left:30%;top:10%;font-size:26px;animation:rise 1.2s ease-out infinite}
.slot .smoke.on::after{left:55%;animation-delay:.4s}
.slot .tops{position:absolute;bottom:-5px;left:50%;transform:translateX(-50%);display:flex;flex-wrap:wrap;justify-content:center;gap:2px;width:110%}
.slot .tops b{font-size:13.5px;background:var(--paper);color:var(--ink);border-radius:4px;padding:0 3px;white-space:nowrap}
.slot .hint{position:absolute;top:-4px;left:50%;transform:translateX(-50%);font-size:13.5px;font-weight:900;color:#fff;background:var(--scallion);border-radius:4px;padding:0 4px;white-space:nowrap}

.tray{display:flex;align-items:center;gap:5px;min-height:30px;background:#F3E4CF;border-radius:10px;padding:3px 6px;box-shadow:inset 0 0 0 2px #E2C08D;overflow-x:auto}
.tray .tl{font-family:var(--display);font-size:14px;color:var(--ink-soft);white-space:nowrap}
.tray .te{font-size:13px;color:var(--ink-soft);white-space:nowrap}
.tray button{display:flex;align-items:center;gap:2px;background:var(--paper);border-radius:999px;padding:1px 8px 1px 2px;font-weight:900;font-size:14px;white-space:nowrap;box-shadow:0 2px 0 #D8C3A5;flex:0 0 auto}
.tray button svg{width:22px;height:22px}
.tray button b{color:var(--tomato)}
.tray button.pop{animation:hop .3s ease-out}
.tray button{position:relative;overflow:hidden}
.tray button .warm{position:absolute;left:0;bottom:0;height:3px;background:var(--tomato);transform-origin:left}
.tray button.cold{background:#E3F2FD;box-shadow:0 2px 0 #9CC7EA;animation:blink .4s infinite alternate}
.tray button.cold .warm{background:#5DA9E9}
.tray button.cold::after{content:"❄️";font-size:10px}
.slot .qty{position:absolute;left:4%;top:4%;transform:none;padding:0 6px;min-width:28px;height:28px;border-radius:999px;background:var(--yolk);color:var(--ink);font-family:var(--display);font-size:15px;display:grid;place-items:center;box-shadow:0 2px 0 rgba(0,0,0,.3)}
.boards{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.board{position:relative;height:54px;border-radius:10px;background:var(--wood);box-shadow:inset 0 0 0 2px var(--wood-dk),0 3px 0 var(--wood-dk);
  display:flex;align-items:center;gap:4px;padding:4px 6px;box-sizing:border-box;min-width:0;
  background-image:repeating-linear-gradient(90deg,transparent 0 18px,rgba(185,127,69,.25) 18px 19px)}
.board.sel{box-shadow:inset 0 0 0 2px var(--wood-dk),0 0 0 3px var(--paper),0 0 0 6px var(--yolk)}
.board .bimg{width:42px;height:42px;flex:0 0 auto}
.board .bimg svg{width:100%;height:100%}
.board .btags{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:2px;align-content:center}
.board .btags b{font-size:13px;background:var(--paper);border-radius:4px;padding:0 3px;white-space:nowrap}
.board .bname{font-weight:900;font-size:15.5px;width:100%}
.board .empty{margin:auto;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700;color:rgba(59,42,32,.45)}
.board .bbtns{display:flex;flex-direction:column;gap:4px;flex:0 0 auto}
.board .bbtns button{width:44px;height:25px;border-radius:7px;font-size:14px;font-weight:900;background:var(--paper);box-shadow:0 2px 0 rgba(0,0,0,.2)}
.board .bbtns .send{background:var(--scallion);color:#fff}

.ings{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.ing{border-radius:10px;font-weight:900;font-size:14px;min-height:42px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
  background:var(--paper);box-shadow:0 3px 0 #D8C3A5;line-height:1.1;padding:2px 0;transition:transform .05s}
.ing svg{width:22px;height:22px}
.ing.g{background:#4A505A;color:#fff;box-shadow:0 3px 0 #23272d}
.ing.g span::after{content:"🔥";font-size:8px;vertical-align:super}
.ing.b{background:#F3D3A6;box-shadow:0 3px 0 var(--wood-dk)}
.ing.c{min-height:34px;font-size:14px;gap:2px!important;padding:0 1px;white-space:nowrap;letter-spacing:-.03em;flex-direction:row;gap:4px;border-radius:999px}
.ing.c i{width:8px;height:8px;flex:0 0 auto;border-radius:50%;display:inline-block;box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.18)}
.ing.s{background:#F0DEC6}
.ing.press,.ing:active{transform:translateY(2px);box-shadow:none}
.shake{animation:shake .3s}

.cups{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.station{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.cup{position:relative;width:100%;height:clamp(52px,8vh,78px);touch-action:none}
.cup .glass{position:absolute;inset:0;clip-path:polygon(6% 0,94% 0,80% 100%,20% 100%);background:rgba(255,255,255,.8);
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.1)}
.cup .liq{position:absolute;left:0;right:0;bottom:0;height:0}
.cup .band{position:absolute;left:0;right:0;border-top:2px dashed rgba(59,42,32,.45);border-bottom:2px dashed rgba(59,42,32,.45);background:rgba(95,163,62,.12)}
.cup .band span{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:11px;font-weight:900;color:var(--ink-soft)}
.cup .nozzle{position:absolute;left:50%;top:-6px;width:8px;height:0;transform:translateX(-50%);border-radius:0 0 4px 4px}
.cup.pouring .nozzle{height:calc(100% - var(--lv,0%) + 6px)}
.cup.pouring{transform:scale(.97)}
.cup.spill .glass{animation:shake .3s}
.cup .dname{position:absolute;left:0;right:0;bottom:4px;text-align:center;font-weight:900;font-size:15px;color:var(--ink);text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 6px #fff;pointer-events:none}
.sugar{width:100%;border-radius:999px;font-weight:900;font-size:13.5px;min-height:24px;box-shadow:inset 0 0 0 2px #E2C08D,0 2px 0 #D8C3A5;color:var(--ink)}
.cupBtns{display:flex;gap:3px;width:100%}
.cupBtns button{flex:1;border-radius:7px;font-weight:900;font-size:14px;min-height:28px;background:var(--paper);box-shadow:0 2px 0 #D8C3A5}
.cupBtns .send{background:var(--scallion);color:#fff;box-shadow:0 2px 0 #3E7525}
.cupBtns button:disabled{opacity:.35}

/* ---------- 浮動提示 ---------- */
#oops{position:absolute;inset:0;z-index:25;display:flex;align-items:center;justify-content:center;pointer-events:none;margin:0 -10px;padding:16px}
#oops .oc{background:var(--paper);border:4px solid var(--yolk);border-radius:22px;padding:16px 18px 14px;text-align:center;max-width:320px;width:100%;
  box-shadow:0 10px 0 rgba(59,42,32,.18);transform:scale(.4) rotate(-6deg);opacity:0}
#oops.show .oc{animation:oopsIn .38s cubic-bezier(.2,1.6,.4,1) forwards}
#oops.hide .oc{transform:none;opacity:1;animation:oopsOut .25s ease-in forwards}
#oops .oe{width:110px;height:110px;margin:-4px auto 2px;animation:wobble 1s ease-in-out infinite alternate}
#oops .oe svg,.mascot svg{width:100%;height:100%;display:block}
.mascot{width:120px;height:120px;margin:0 auto -4px;animation:wobble 1.2s ease-in-out infinite alternate}
#oops .ol{font-family:var(--display);font-size:26px;line-height:1.3;color:var(--ink);text-wrap:balance}
#oops .os{margin-top:6px;font-weight:700;font-size:14px;color:var(--tomato)}
@keyframes oopsIn{0%{transform:scale(.4) rotate(-6deg);opacity:0}100%{transform:scale(1) rotate(-2deg);opacity:1}}
@keyframes oopsOut{to{transform:scale(.8) translateY(30px);opacity:0}}
#toast{position:absolute;left:50%;top:30%;transform:translate(-50%,-50%);background:var(--ink);color:#fff;font-weight:900;padding:9px 16px;border-radius:12px;
  font-size:17px;opacity:0;pointer-events:none;transition:opacity .15s;z-index:20;text-align:center;max-width:85%}
#toast.show{opacity:.92}
#flash{position:absolute;inset:0;background:var(--tomato);opacity:0;pointer-events:none;z-index:19;margin:0 -10px}
#flash.on{animation:flash .45s}
.floater{position:absolute;z-index:21;font-family:var(--display);font-size:20px;color:var(--scallion);pointer-events:none;animation:floatUp 1.1s ease-out forwards;text-shadow:0 2px 0 #fff;white-space:nowrap}
.floater.bad{color:var(--tomato)}

/* ---------- 覆蓋畫面 ---------- */
.overlay{position:absolute;inset:0;z-index:30;background:rgba(59,42,32,.55);display:flex;align-items:center;justify-content:center;margin:0 -10px;padding:16px;overflow-y:auto}
.card{background:var(--cream);border-radius:20px;padding:18px 16px;width:100%;max-width:360px;text-align:center;box-shadow:0 8px 0 rgba(0,0,0,.2);
  display:flex;flex-direction:column;gap:11px;border:4px solid var(--tomato);margin:auto}
.card h1{font-family:var(--display);font-size:30px;margin:0;color:var(--tomato);text-wrap:balance;line-height:1.15}
.card h2{font-family:var(--display);font-size:26px;margin:0;color:var(--tomato);text-wrap:balance}
.card p{margin:0;line-height:1.55;font-size:15.5px}
.card .big{font-family:var(--display);font-size:19px;line-height:1.45;color:var(--ink)}
.card ul{text-align:left;margin:0;padding-left:20px;font-size:15px;line-height:1.55}
.namerow{display:flex;gap:8px;align-items:center}
.presets{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.presets button{background:var(--paper);border:2px solid var(--wood);border-radius:999px;padding:4px 10px;font-weight:700;font-size:13px}
.presets button.on{background:var(--tomato);border-color:var(--tomato);color:#fff}
.signPreview{background:var(--tomato);color:#fff;font-family:var(--display);font-size:24px;border-radius:10px;padding:8px 6px;border-bottom:5px solid var(--tomato-dk);text-shadow:0 2px 0 var(--tomato-dk);min-height:1.3em}
.namerow label{font-weight:900;font-size:14px;white-space:nowrap}
.namerow input{flex:1;min-width:0;font:inherit;font-family:var(--display);font-size:20px;color:var(--ink);background:var(--paper);border:3px solid var(--wood);border-radius:12px;padding:6px 10px;
  -webkit-user-select:text;user-select:text;touch-action:auto}
.namerow input:focus{outline:none;border-color:var(--tomato)}
#dice{width:48px;height:48px;font-size:28px;border-radius:12px;background:var(--yolk);box-shadow:0 4px 0 #C98D16;flex:0 0 auto}
#dice.roll{animation:roll .5s ease-out}
.cta{background:var(--tomato);color:#fff;font-family:var(--display);font-size:22px;border-radius:14px;padding:12px;box-shadow:0 5px 0 var(--tomato-dk)}
.cta:active{transform:translateY(3px);box-shadow:0 2px 0 var(--tomato-dk)}
.ghostbtn{font-weight:700;color:var(--ink-soft);font-size:13px;text-decoration:underline}
.titleBadge{background:var(--yolk);border-radius:14px;padding:10px;font-family:var(--display);font-size:26px;color:var(--ink);box-shadow:0 4px 0 #C98D16}
.books{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-variant-numeric:tabular-nums}
.books div{background:var(--paper);border-radius:10px;padding:6px 0;font-size:12px;font-weight:700;color:var(--ink-soft)}
.books b{display:block;font-family:var(--display);font-size:20px;color:var(--ink)}
.stat{display:flex;justify-content:center;gap:14px;font-size:13px;font-weight:700;color:var(--ink-soft);font-variant-numeric:tabular-nums;flex-wrap:wrap}

@keyframes hop{0%{transform:translateY(16px) scale(.8);opacity:0}100%{transform:none;opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes bob{to{transform:translateY(-3px) scale(1.04)}}
@keyframes blink{to{opacity:.25}}
@keyframes pulse{to{transform:scale(1.08)}}
@keyframes rise{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-26px);opacity:0}}
@keyframes flash{0%{opacity:.45}100%{opacity:0}}
@keyframes floatUp{to{transform:translateY(-40px);opacity:0}}
@keyframes flashBg{50%{background:var(--yolk)}}
@keyframes wobble{0%{transform:rotate(-5deg) translateY(0)}100%{transform:rotate(5deg) translateY(-4px)}}
#app.final::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:18;box-shadow:inset 0 0 0 5px rgba(228,87,46,.85),inset 0 0 40px 12px rgba(228,87,46,.45);animation:edge .5s ease-in-out infinite alternate}
#app.final10::after{box-shadow:inset 0 0 0 8px rgba(228,87,46,.95),inset 0 0 70px 22px rgba(228,87,46,.6);animation-duration:.22s}
#bigCount{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);font-family:var(--display);font-size:150px;line-height:1;color:var(--tomato);opacity:.3;pointer-events:none;z-index:17;text-shadow:0 6px 0 rgba(0,0,0,.15)}
#bigCount.beat{animation:countBeat .9s ease-out}
@keyframes edge{from{opacity:.35}to{opacity:1}}
@keyframes countBeat{0%{transform:translate(-50%,-50%) scale(1.5);opacity:.6}100%{transform:translate(-50%,-50%) scale(1);opacity:.3}}
@keyframes roll{0%{transform:rotate(0)}100%{transform:rotate(720deg)}}
@media (max-width:385px){.sign{font-size:14px;letter-spacing:0}.pill{padding:2px 6px}.stats{gap:4px;font-size:14px}.iconbtn{width:26px;height:26px}.ing{font-size:13px}.ing.c{font-size:13.5px}.tk-item{font-size:15px}.drinkName{font-size:13.5px}.sugar,.cupBtns button{font-size:12.5px}}
@media (max-height:840px){.grill{min-height:104px}.ing{min-height:38px}.ing.c{min-height:31px}.tray{min-height:28px}}
@media (max-height:700px){.tk-items{min-height:70px;gap:2px 8px}.board{height:44px!important}.board .bimg{width:32px;height:32px}.grill{min-height:88px!important}.ing{min-height:34px}.ing.c{min-height:27px}.kitchen{gap:3px!important}.tray{min-height:24px}.tk-item{font-size:15px}.mini{width:30px;height:30px}.mini svg{width:25px;height:25px}.grill{min-height:96px}.kitchen{gap:4px;padding-top:4px}.ing{min-height:34px}.ing svg{width:17px;height:17px}.ing.c{min-height:27px}.board{height:46px}.board .bimg{width:34px;height:34px}.board .bbtns button{height:19px}.ticket{min-height:66px}.tray{min-height:26px;padding:1px 6px}.cup{height:42px}.sugar{min-height:21px}.cupBtns button{min-height:25px}.front{padding-top:5px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style>

<body>
<div id="app">
  <header class="hud">
    <div class="sign" id="sign">帥哥美女早餐店</div>
    <div class="stats">
      <span class="pill" id="timer">5:00</span>
      <span class="pill" id="served">0/20</span>
      <span id="lives"></span>

  <div class="rival" id="rival" hidden></div>

  <section class="front">

  <section class="kitchen">

  <div id="toast"></div>

  <div id="oops"><div class="oc"><div class="oe"></div><div class="ol"></div><div class="os"></div></div></div>

  <div class="overlay" id="overlay">
    <div class="card" id="card"></div>
  </div>
</div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);

/* ================= 亂數（用種子，之後雙人對戰可以讓兩邊訂單一樣） ================= */
let seed = 1;
function rand(){ seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }
const rnd = (a,b) => a + rand()*(b-a);
const ri = (a,b) => Math.floor(rnd(a,b+1));
const pick = a => a[Math.floor(rand()*a.length)];
const pickAny = a => a[Math.floor(Math.random()*a.length)];   // 純裝飾用，不影響對局
const clamp01 = t => Math.max(0,Math.min(1,t));
const lerp = (a,b,t) => a+(b-a)*clamp01(t);

/* ================= 菜單與食材 ================= */
const PER_PAGE = 4, TRAY_LIFE = 30, MAX_BATCH = 3, GAME_LEN = 300, GOAL = 20, LIVES = 3, COST_RATE = .4;
// 夾料：cooked = 要先上煎台；sauce = 鐵板麵醬
const ING = {
  pork:    {name:'肉鬆',  price:10, color:'#B5743A'},
  cheese:  {name:'起司',  price:10, color:'#FFB627'},
  corn:    {name:'玉米',  price:10, color:'#FFE15A'},
  tuna:    {name:'鮪魚',  price:15, color:'#E8C3A8'},
  ham:     {name:'火腿',  price:10, color:'#F49AA0'},
  lettuce: {name:'生菜',  price:5,  color:'#7CC35A'},
  tomato:  {name:'番茄',  price:5,  color:'#E8483B'},
  cucumber:{name:'小黃瓜',price:5,  color:'#3F8A35'},
  youtiao: {name:'油條',  price:10, color:'#D9963A'},
  radishd: {name:'菜脯',  price:5,  color:'#C9A04E'},
  egg:     {name:'荷包蛋',price:10, color:'#F6B93B', cooked:true, cook:2.5},
  bacon:   {name:'培根',  price:15, color:'#D9534F', cooked:true, cook:2.5},
  chop:    {name:'豬排',  price:25, color:'#B8742F', cooked:true, cook:3.5},
  chicken: {name:'卡拉雞',price:30, color:'#E08A2C', cooked:true, cook:4},
  pepper:  {name:'黑胡椒',price:0,  color:'#4A2E1A', sauce:true},
  mush:    {name:'蘑菇',  price:0,  color:'#B98B5E', sauce:true},
};
// 主食：都要配料，不能直接出。蛋餅在煎台做，其他在工作台組
const MAINS = {
  egg_pancake:{name:'蛋餅',  price:25, grill:true, cook:4, fill:['pork','cheese','corn','tuna','ham','bacon']},
  toast:      {name:'三明治',price:20, fill:['ham','cheese','egg','lettuce','tomato','cucumber','bacon','tuna','chop']},
  burger:     {name:'漢堡',  price:30, fill:['chop','chicken','egg','cheese','lettuce','tomato','bacon']},
  riceball:   {name:'飯糰',  price:30, fill:['youtiao','radishd','pork','egg','cheese']},
};
const SIDES = {
  radish:   {name:'蘿蔔糕',price:35, cook:4.5},
  noodle:   {name:'鐵板麵',price:55, cook:4.5},
  hotdog:   {name:'熱狗',  price:25, cook:3.5},
  hashbrown:{name:'薯餅',  price:25, cook:3.5},
};
const DRINKS = {
  milktea: {name:'奶茶',color:'#C9A27C'},
  blacktea:{name:'紅茶',color:'#9C4A1C'},
  soy:     {name:'豆漿',color:'#EFE2C4'},
  ricemilk:{name:'米漿',color:'#C9A479'},
  coffee:  {name:'咖啡',color:'#6B4A33'},
};
const SUGARS = { none:{name:'無糖',color:'#FFFFFF'}, half:{name:'半糖',color:'#FFE9A8'}, full:{name:'全糖',color:'#F6B93B'} };
const SUGAR_ORDER = ['none','half','full'];
const SIZES = { M:{name:'中',lo:50,hi:66,price:20}, L:{name:'大',lo:80,hi:99,price:25} };
const SHOP_NAMES = ['蛋定早餐店','堡你滿意','堡持聯絡','鮪你而生','肉鬆一下','荷包蛋滿滿','餅氣凝神','餅餅有禮',
  '吐司你了','蛋蛋的哀傷','饅饅來','饅頭大汗','起司不起來','米漿糊塗','豆漿好陽光','呷飽未早餐店','金厚呷早餐','哩賀早餐店',
  '帥哥美女早餐店','七貓早餐店'];

const cookOf = t => (MAINS[t] && MAINS[t].cook) || (SIDES[t] && SIDES[t].cook) || (ING[t] && ING[t].cook);
const nameOf = t => (MAINS[t]||SIDES[t]||ING[t]||DRINKS[t]).name;

/* ================= 扁平風食物插圖（SVG） ================= */
function topSVG(id){
  switch(id){
    case 'pork':  return '<g fill="#B5743A"><circle cx="31" cy="42" r="6"/><circle cx="38" cy="36" r="5"/><circle cx="40" cy="45" r="5"/><circle cx="33" cy="50" r="4"/></g>';
    case 'cheese':return '<rect x="40" y="40" width="22" height="22" rx="3" fill="#FFB627" transform="rotate(14 51 51)"/><circle cx="47" cy="47" r="2.5" fill="#FFD36E"/>';
    case 'ham':   return '<circle cx="65" cy="42" r="11" fill="#F49AA0"/><circle cx="65" cy="42" r="7" fill="#F8B7BB"/>';
    case 'corn':  return '<g fill="#FFE15A" stroke="#E2B92B" stroke-width="1"><circle cx="42" cy="66" r="3.4"/><circle cx="49" cy="70" r="3.4"/><circle cx="37" cy="72" r="3.4"/><circle cx="53" cy="64" r="3.4"/></g>';
    case 'bacon': return '<path d="M58 66 q5 -6 10 0 t10 0" stroke="#D9534F" stroke-width="7" fill="none" stroke-linecap="round"/>';
    case 'tuna':  return '<path d="M22 58 q6 -10 16 -4 q4 8 -4 12 q-10 2 -12 -8z" fill="#E8C3A8"/>';
    case 'pepper':return '<ellipse cx="50" cy="52" rx="24" ry="20" fill="#4A2E1A" opacity=".88"/><g fill="#111"><circle cx="42" cy="46" r="1.6"/><circle cx="55" cy="44" r="1.6"/><circle cx="50" cy="58" r="1.6"/></g>';
    case 'mush':  return '<ellipse cx="50" cy="52" rx="24" ry="20" fill="#B98B5E" opacity=".9"/><g fill="#EDE0CC" stroke="#8C6440" stroke-width="1.5"><path d="M38 52 a7 6 0 0 1 14 0z"/><path d="M52 44 a6 5 0 0 1 12 0z"/></g>';
  }
  return '';
}
function cupSVG(color){
  return `<path d="M24 24 h52 l-8 64 h-36z" fill="#FFFFFF"/><path d="M27 40 h46 l-6 46 h-34z" fill="${color}"/><rect x="20" y="18" width="60" height="8" rx="3" fill="#F2F2F2"/><rect x="20" y="18" width="60" height="3" rx="1.5" fill="#E4572E"/><rect x="54" y="4" width="6" height="22" rx="2" fill="#5FA33E" transform="rotate(12 57 15)"/>`;
}
function foodSVG(type, tops){
  tops = tops || [];
  let s = '';
  switch(type){
    case 'egg_pancake':
      s = '<ellipse cx="50" cy="52" rx="42" ry="38" fill="#F2D29B"/><ellipse cx="50" cy="52" rx="35" ry="31" fill="#F6C453"/><path d="M26 47 q12 -9 24 0 t24 0" stroke="#FBE3A0" stroke-width="5" fill="none" stroke-linecap="round"/><g fill="#5FA33E"><circle cx="34" cy="62" r="2.6"/><circle cx="60" cy="36" r="2.6"/><circle cx="68" cy="60" r="2.6"/></g>';
      s += tops.map(topSVG).join(''); break;
    case 'toast':
      s = '<path d="M14 72 L50 22 L86 72z" fill="#F5DEB3"/><path d="M20 66 L50 26 L80 66z" fill="#5FA33E"/><path d="M24 62 L50 30 L76 62z" fill="#F49AA0"/><path d="M28 58 L50 34 L72 58z" fill="#F6C453"/><path d="M32 56 L50 38 L68 56z" fill="#FFF3D6"/><rect x="14" y="70" width="72" height="6" rx="2" fill="#E2C08D"/>'; break;
    case 'burger':
      s = '<path d="M16 50 q34 -40 68 0z" fill="#E4A44C"/><g fill="#FFF3D6"><ellipse cx="38" cy="36" rx="2.5" ry="1.5"/><ellipse cx="52" cy="31" rx="2.5" ry="1.5"/><ellipse cx="64" cy="38" rx="2.5" ry="1.5"/></g><path d="M14 54 q9 -6 18 0 t18 0 t18 0 t18 0" stroke="#6CB24A" stroke-width="6" fill="none" stroke-linecap="round"/><rect x="16" y="56" width="68" height="12" rx="6" fill="#7A4A2A"/><rect x="18" y="68" width="64" height="14" rx="6" fill="#E4A44C"/>'; break;
    case 'riceball':
      s = '<rect x="12" y="32" width="76" height="36" rx="18" fill="#7B5A8C"/><rect x="18" y="36" width="64" height="12" rx="6" fill="#9A7AAB"/><ellipse cx="18" cy="50" rx="6" ry="14" fill="#B5743A"/><ellipse cx="82" cy="50" rx="6" ry="14" fill="#F6C453"/><path d="M14 30 L86 70" stroke="#fff" stroke-width="2" opacity=".55"/>'; break;
    case 'radish':
      s = '<rect x="12" y="26" width="38" height="38" rx="5" fill="#F1E9D8" stroke="#D9A35A" stroke-width="5"/><rect x="48" y="38" width="38" height="38" rx="5" fill="#F1E9D8" stroke="#D9A35A" stroke-width="5"/>'; break;
    case 'egg':
      s = '<path d="M50 14 C74 14 88 30 84 50 C80 70 90 84 62 86 C40 88 14 82 16 58 C18 40 26 14 50 14z" fill="#FFFFFF"/><circle cx="50" cy="50" r="15" fill="#F6B93B"/><circle cx="45" cy="45" r="4" fill="#FFE29A"/>'; break;
    case 'noodle':
      s = '<g fill="none" stroke="#F2C14E" stroke-width="5" stroke-linecap="round"><path d="M18 50 q10 -20 22 0 t22 0 t20 0"/><path d="M20 62 q10 -18 22 0 t22 0 t18 -4"/><path d="M24 38 q12 -14 22 0 t22 0 t12 4"/><path d="M28 74 q10 -12 20 0 t20 0"/></g>';
      s += tops.map(topSVG).join(''); break;
    case 'hotdog':
      s = '<g transform="rotate(-18 50 50)"><rect x="12" y="30" width="76" height="18" rx="9" fill="#C8553D"/><rect x="12" y="56" width="76" height="18" rx="9" fill="#C8553D"/><g stroke="#E98A6E" stroke-width="3" stroke-linecap="round"><path d="M30 34 l6 10"/><path d="M48 34 l6 10"/><path d="M66 34 l6 10"/><path d="M30 60 l6 10"/><path d="M48 60 l6 10"/><path d="M66 60 l6 10"/></g></g>'; break;
    case 'hashbrown':
      s = '<rect x="16" y="26" width="68" height="48" rx="22" fill="#E9A93B" stroke="#C7822A" stroke-width="4"/><g stroke="#F6CB72" stroke-width="2.4"><path d="M30 38 l38 24"/><path d="M28 50 l30 18"/><path d="M42 32 l30 18"/></g>'; break;
    case 'bacon':
      s = '<g fill="none" stroke-linecap="round"><path d="M14 38 q9 -10 18 0 t18 0 t18 0 t18 0" stroke="#D9534F" stroke-width="12"/><path d="M14 38 q9 -10 18 0 t18 0 t18 0 t18 0" stroke="#F7C6C0" stroke-width="3"/><path d="M14 64 q9 -10 18 0 t18 0 t18 0 t18 0" stroke="#D9534F" stroke-width="12"/><path d="M14 64 q9 -10 18 0 t18 0 t18 0 t18 0" stroke="#F7C6C0" stroke-width="3"/></g>'; break;
    case 'chop':
      s = '<path d="M18 44 q8 -22 40 -18 q28 4 26 28 q-2 26 -34 26 q-36 0 -32 -36z" fill="#C98A3E"/><g fill="#E6B066"><circle cx="34" cy="40" r="2.5"/><circle cx="50" cy="36" r="2.5"/><circle cx="64" cy="46" r="2.5"/><circle cx="42" cy="58" r="2.5"/><circle cx="60" cy="64" r="2.5"/><circle cx="30" cy="62" r="2"/></g>'; break;
    case 'chicken':
      s = '<path d="M22 50 q-6 -20 14 -26 q10 -10 24 -2 q20 -2 22 18 q8 14 -6 26 q-8 14 -28 10 q-22 2 -26 -26z" fill="#E39B3B" stroke="#B86E1E" stroke-width="3"/><g fill="#F5C26B"><circle cx="40" cy="40" r="3"/><circle cx="58" cy="48" r="3"/><circle cx="46" cy="62" r="3"/></g>'; break;
    default:
      if (DRINKS[type]) s = cupSVG(DRINKS[type].color);
  }
  return `<svg viewBox="0 0 100 100" aria-hidden="true">${s}</svg>`;
}

/* ================= 餐點 ================= */
function makeItem(kind, type, tops, size, sugar){
  tops = (tops||[]).slice();
  let label, sub = '', price;
  if (kind === 'main'){
    price = MAINS[type].price + tops.reduce((a,t)=>a+ING[t].price, 0);
    label = (type==='egg_pancake' && !tops.length) ? '原味蛋餅' : MAINS[type].name;
    sub = tops.map(t=>ING[t].name).join('、');
  } else if (kind === 'side'){
    price = SIDES[type].price; label = SIDES[type].name;
    if (type === 'noodle') sub = tops.length ? ING[tops[0]].name+'醬' : '還沒加醬';
  } else {
    price = SIZES[size] ? SIZES[size].price : 0;
    label = (SIZES[size] ? SIZES[size].name : '怪') + '杯' + DRINKS[type].name;
    sub = SUGARS[sugar] ? SUGARS[sugar].name : '';
  }
  return {kind, type, tops, size, sugar, label, sub, price};
}
const costOf = it => Math.max(3, Math.round(it.price * COST_RATE));

// 比對：exact 剛好、over 給多了（收訂單的錢，差額算賠）、under 少給（免費）
function compare(want, made){
  if (want.kind !== made.kind || want.type !== made.type) return null;
  if (want.kind === 'drink'){
    if (made.sugar !== want.sugar) return 'under';
    if (made.size === want.size) return 'exact';
    return (want.size === 'M' && made.size === 'L') ? 'over' : 'under';
  }
  if (want.kind === 'side') return (want.type !== 'noodle' || want.tops[0] === made.tops[0]) ? 'exact' : 'under';
  if (!want.tops.every(t=>made.tops.includes(t))) return 'under';
  return made.tops.length === want.tops.length ? 'exact' : 'over';
}

function pickFill(type, n){
  const pool = MAINS[type].fill.slice(), out = [];
  for (let i=0;i<n && pool.length;i++) out.push(pool.splice(Math.floor(rand()*pool.length),1)[0]);
  return out;
}
function randomItem(t){
  const table = t < 40
    ? [['egg_pancake',4],['toast',2],['drink',4],['hashbrown',1]]
    : [['egg_pancake',3],['toast',1.6],['burger',1.4],['riceball',1.4],['drink',4.5],['radish',1],['noodle',1],['hotdog',.8],['hashbrown',.8]];
  let r = rand()*table.reduce((a,b)=>a+b[1],0), k = table[0][0];
  for (const [name,w] of table){ if ((r-=w) <= 0){ k = name; break; } }
  if (MAINS[k]){
    const hi = t < 60 ? 1 : t < 160 ? 2 : 3;
    const lo = k === 'egg_pancake' ? 0 : 1;
    return makeItem('main', k, pickFill(k, ri(lo, Math.max(lo,hi))));
  }
  if (k === 'drink') return makeItem('drink', pick(Object.keys(DRINKS)), [], rand()<.5?'M':'L', pick(SUGAR_ORDER));

let soundOn = true;
const sfx = (() => {
  let ac, master, sizzleG, pourG;
  const bgm = {on:false, next:0, step:0};
  const MELODY = [76,0,79,0,81,79,76,0, 74,0,76,79,76,0,74,0, 72,0,74,0,76,79,81,0, 79,76,74,0,72,0,0,0];
  const BASS = [48,43,45,43];
  const midi = n => 440 * Math.pow(2, (n-69)/12);
  function init(){
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    ac = new AC(); master = ac.createGain(); master.gain.value = soundOn ? 1 : 0; master.connect(ac.destination);
    const len = ac.sampleRate * 2, buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
    for (let i=0;i<len;i++) d[i] = Math.random()*2-1;
    const s1 = ac.createBufferSource(); s1.buffer = buf; s1.loop = true;
    const hp = ac.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=2200;
    const pk = ac.createBiquadFilter(); pk.type='peaking'; pk.frequency.value=5500; pk.gain.value=8;
    sizzleG = ac.createGain(); sizzleG.gain.value = 0;
    s1.connect(hp).connect(pk).connect(sizzleG).connect(master); s1.start();
    const s2 = ac.createBufferSource(); s2.buffer = buf; s2.loop = true; s2.playbackRate.value = .6;
    const lp = ac.createBiquadFilter(); lp.type='bandpass'; lp.frequency.value=700; lp.Q.value=1.4;
    pourG = ac.createGain(); pourG.gain.value = 0;
    s2.connect(lp).connect(pourG).connect(master); s2.start();
  }
  function siren(delay, dur, lvl){
    if (!ac) return;
    const t0 = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(520, t0);
    o.frequency.linearRampToValueAtTime(lvl >= 3 ? 1100 : 880, t0 + dur/2);
    o.frequency.linearRampToValueAtTime(520, t0 + dur);
    g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(lvl >= 3 ? .05 : .03, t0 + .05); g.gain.linearRampToValueAtTime(0, t0 + dur);
    o.connect(g).connect(master); o.start(t0); o.stop(t0 + dur + .02);
  }
  function tone(f, dur, type='sine', vol=.18, delay=0, slide){
    if (!ac) return;

    if (slide) o.frequency.exponentialRampToValueAtTime(slide, t0+dur);

    init,
    mute(on){ if (master) master.gain.value = on ? 1 : 0; },
    sizzle(n){ if (!sizzleG) return; const v = n ? Math.min(.22, .06 + n*.035) * (.6 + Math.random()*.8) : 0; sizzleG.gain.setTargetAtTime(v, ac.currentTime, .03); },
    pour(on){ if (pourG) pourG.gain.setTargetAtTime(on ? .35 : 0, ac.currentTime, .04); },
    plop(){ tone(320,.12,'sine',.25,0,110); },
    tick(){ tone(900,.05,'triangle',.12); },
    ready(){ tone(660,.09,'triangle',.16); tone(990,.12,'triangle',.14,.08); },
    ding(){ tone(1046,.12,'sine',.2); tone(1568,.2,'sine',.18,.09); },
    cash(){ tone(1318,.07,'square',.08); tone(1760,.16,'square',.08,.07); tone(2093,.2,'sine',.12,.14); },
    buzz(){ tone(150,.38,'sawtooth',.2,0,90); },

    win(){ [523,659,784,1046,1318].forEach((f,i)=>tone(f,.25,'triangle',.18,i*.11)); },
    lose(){ [392,330,262,196].forEach((f,i)=>tone(f,.3,'sawtooth',.12,i*.18)); },
    chime(){ tone(1046,.14,'triangle',.2); tone(1318,.14,'triangle',.2,.11); tone(1568,.3,'triangle',.22,.22); },
    bgmStart(){ if (!ac) return; bgm.on = true; bgm.step = 0; bgm.next = ac.currentTime + .1; },
    bgmStop(){ bgm.on = false; },

    bgmTick(bpm, lvl=0){
      if (!ac || !bgm.on) return;
      const step = 60 / bpm / 2;
      while (bgm.next < ac.currentTime + .15){
        const i = bgm.step % 32, when = bgm.next - ac.currentTime;
        const tr = lvl >= 2 ? 5 : lvl >= 1 ? 2 : 0;          // 越後面 key 越高

function newOrder(o={}){
  const tv = o.tv != null ? o.tv : S.gt;
  const order = o.order || genOrder(tv);
  const maxP = o.patience || (lerp(36, 24, tv/GAME_LEN) + order.length*8);
  S.spawned++;
  return {
    id:++S.cid, where: rand()<.45 ? '內用' : '外帶',
    order, done:order.map(()=>false), p:maxP, maxP, earned:0,
    type:o.type||'normal', hidden:!!o.hidden, free:false, greeted:false, changeAt:null,
  };
}

// 第 k 張單：用 (種子, k) 決定內容，雙人比賽時兩邊拿到一模一樣的單
function orderFor(k){
  const save = seed;
  seed = (S.baseSeed ^ Math.imul(k, 2654435761)) >>> 0; rand(); rand();
  const tv = k * 14, coop = S.mode === 'coop';
  let o;
  if (k === 3) o = newOrder({type:'uncle', order:UNCLE_ORDER(), patience:55, tv});
  else if (k === 10 || k === 17) o = newOrder({type:'uncle', order:UNCLE_ORDER(), patience:50, hidden:true, tv});
  else if (k >= 4 && k % 4 === 0){
    const n = Math.min(8, (tv < 150 ? ri(5,6) : ri(6,7)) + (coop ? 1 : 0));
    o = newOrder({type:'uber', order:genOrder(tv, n), patience:lerp(80, 66, tv/GAME_LEN) + n*4, tv});
  } else {
    const ord = genOrder(tv);
    if (coop && ord.length < 5) ord.push(randomItem(tv));
    o = newOrder({order:ord, tv});
  }
  o.id = k;
  if (coop){ o.maxP *= 1.15; o.p = o.maxP; }
  if (tv > 80 && o.type !== 'uncle' && o.order.some(x=>x.kind==='main' && x.tops.length < 3) && rand() < .22) o.changeIn = rnd(3, 7);
  seed = save;
  return o;
}

/* 出餐：交給目前這張單 */
function deliver(item, remote){
  const c = S.queue[0];
  if (!c){ if (!remote) toast('還沒有訂單喔～'); return false; }
  if (isGuest()){ sendAct({k:'d', it:[item.kind, item.type, item.tops, item.size||0, item.sugar||0]}); sfx.tick(); return true; }
  let best = -1, kind = null;
  c.order.forEach((o,i)=>{
    if (c.done[i]) return;
    const r = compare(o, item);
    if (r === 'exact' && kind !== 'exact'){ best = i; kind = r; }
    else if (r === 'over' && !kind){ best = i; kind = r; }
  });
  if (best >= 0){
    const want = c.order[best];
    c.done[best] = true; sfx.ding(); fx({a:'snd', v:'ding'});
    if (c.free) lose(costOf(item), '請客');
    else {
      c.earned += want.price; earn(want.price);
      if (kind === 'over'){
        const extra = item.price - want.price;
        setTimeout(()=>lose(extra, '給太多'), 250);
        sfx.meh();
        const tm = want.kind === 'drink' ? `做成大杯，只能收中杯的錢` : `多加了料，只能收原本的錢`;
        toast(tm); fx({a:'toast', x:tm});
      }
    }
    if (c.done.every(Boolean)) completeOrder(c); else renderTicket();
    return true;
  }
  // 送錯或少給
  const sameType = c.order.some((o,i)=>!c.done[i] && o.type === item.type);
  let line;
  const sugarOff = item.kind === 'drink' && c.order.some((o,i)=>!c.done[i] && o.type === item.type && o.sugar !== item.sugar && (o.size === item.size || (o.size==='M' && item.size==='L')));
  if (sugarOff) line = pickAny(LINES.wrongSugar);
  else if (item.kind === 'drink' && sameType) line = pickAny(LINES.wrongDrink);
  else line = pickAny(sameType ? LINES.wrongDetail : LINES.wrongItem);

/* ================= 煎台 ================= */

  }

  S.slots[i] = {type, cat, tops:[], t:0, state:'cook', born:++S.born, clearIn:0, qty:1};
  if (cat !== 'fill' && (type === 'egg_pancake' || type === 'noodle')) S.sel = {w:'g', i};
  sfx.plop(); renderSlot(i); renderSel();
}
function slotItem(s){ return s.cat === 'main' ? makeItem('main', s.type, s.tops) : makeItem('side', s.type, s.tops); }
function tapSlot(i){
  const s = S.slots[i]; if (!s) return;
  if (s.state === 'burnt'){ clearSlot(i); return; }
  if (s.cat === 'fill'){
    if (s.state !== 'ready'){ toast(`${ING[s.type].name}還沒熟，再按一次同樣的料可以多煎一份`); return; }
    let n = s.qty;
    if (addIng(s.type, null, true)) n--;
    if (n > 0){ for (let k=0;k<n;k++) S.tray[s.type].push(S.gt); renderTray(s.type); toast(`${ING[s.type].name} ×${n} 放到保溫台（${TRAY_LIFE} 秒內要用）`); }
    clearSlot(i);
    return;
  }
  if (s.state === 'ready'){ if (deliver(slotItem(s))) clearSlot(i); return; }
  if (s.type === 'egg_pancake' || s.type === 'noodle'){ S.sel = {w:'g', i}; renderSel(); sfx.tick(); }
}
function tossSlot(i){
  const s = S.slots[i]; if (!s) return;
  if (s.state !== 'burnt') lose(costOf(s.cat === 'fill' ? {price:ING[s.type].price*s.qty} : slotItem(s)), '丟掉');
  clearSlot(i);
}
function clearSlot(i){ S.slots[i] = null; if (S.sel && S.sel.w==='g' && S.sel.i===i) S.sel = null; renderSlot(i); renderSel(); }

/* ================= 工作台（三明治、漢堡、飯糰） ================= */

}

/* ================= 加料：加到選取的那份（蛋餅、鐵板麵、工作台） ================= */
function targetOf(ref){
  if (!ref) return null;
  const x = ref.w === 'g' ? S.slots[ref.i] : S.board[ref.i];
  if (!x) return null;
  if (ref.w === 'g' && (x.cat !== 'main' && x.type !== 'noodle' || x.state === 'burnt')) return null;
  return x;
}
function accepts(x, id){
  if (ING[id].sauce) return x.type === 'noodle';
  return !!MAINS[x.type] && MAINS[x.type].fill.includes(id);
}
function addIng(id, el, quiet){
  let ref = S.sel, x = targetOf(ref);
  if (!x || !accepts(x, id)){
    ref = null; let bestBorn = -1;
    const consider = (w, i) => { const r = {w, i}, y = targetOf(r); if (y && accepts(y, id) && !y.tops.includes(id) && y.born > bestBorn){ ref = r; bestBorn = y.born; } };
    S.slots.forEach((_,i)=>consider('g', i)); S.board.forEach((_,i)=>consider('b', i));
    x = targetOf(ref);
  }
  const N = ING[id].name;
  if (!x){
    const where = ING[id].sauce ? '鐵板麵' : Object.values(MAINS).filter(m=>m.fill.includes(id)).map(m=>m.name).join('、');
    if (!quiet){ toast(`${N}可以加在：${where}`); shakeEl(el); }
    return false;
  }
  if (ING[id].sauce) x.tops = [id];
  else { if (x.tops.includes(id)){ if (!quiet) toast(`已經加過${N}了`); return false; } x.tops.push(id); }
  S.sel = ref; sfx.tick();
  if (ref.w === 'g') renderSlot(ref.i); else renderBoard(ref.i);
  renderSel();
  return true;
}

/* ================= 飲料 ================= */
function sizeOf(level){
  for (const k in SIZES) if (level >= SIZES[k].lo && level <= SIZES[k].hi) return k;
  return 'X';
}
function serveCup(i){
  const c = S.cups[i];
  if (c.level < 3 || c.pouring) return;
  if (deliver(makeItem('drink', c.type, [], sizeOf(c.level), c.sugar))){ c.level = 0; c.sugar = 'none'; renderCup(i); }

/* ================= 主迴圈 ================= */
let last = 0;
function loop(ts){
  const dt = Math.min(.05, (ts - last)/1000 || 0); last = ts;
  if (S.running && !S.paused && !S.over) update(dt);
  requestAnimationFrame(loop);
}
function update(dt){
  if (!isGuest()) S.gt += dt;
  const t = S.gt, guest = isGuest();

  if (!guest){
    if (!S.rush && t > 200){ S.rush = true; toast('上班上課尖峰！訂單變大了'); }
    // 一次一張單，完成才出下一張
    if (!S.queue.length){
      S.spawnT -= dt;
      if (S.spawnT <= 0){
        const c = orderFor(++S.k);
        if (c.type === 'uber') toast(`Uber 單來了！一次 ${c.order.length} 樣！`);
        spawn(c);
      }
    }
    for (const c of S.queue.slice()){
      c.p -= dt;
      if (c.p <= 0){ orderTimeout(c); if (S.over) return; }
    }
    // 改單
    const f = S.queue[0];
    if (f && f.changeAt && t >= f.changeAt){
      f.changeAt = null;
      const idx = f.order.findIndex((o,i)=>!f.done[i] && o.kind==='main' && o.tops.length < 3);
      if (idx >= 0){
        const o = f.order[idx];
        const add = MAINS[o.type].fill.filter(x=>!o.tops.includes(x));
        const top = add[(f.id * 7) % add.length];
        f.order[idx] = makeItem('main', o.type, o.tops.concat(top));
        f.order[idx].changed = true;
        custSay(`改單！${MAINS[o.type].name}加${ING[top].name}！`); sfx.tick();
        renderTicket();
      }
    }
    if (S.queue[0] !== S.lastFirst){ S.lastFirst = S.queue[0]; onFirstChanged(); }
  } else if (S.queue[0]) S.queue[0].p -= dt;

  // 煎台
  const win = lerp(6, 4, t/GAME_LEN);
  let cooking = 0;
  S.slots.forEach((s,i)=>{
    if (!s) return;
    s.t += dt;
    const cook = cookOf(s.type);
    if (s.state === 'cook' && s.t >= cook){ s.state = 'ready'; sfx.ready(); renderSlot(i); }
    if (s.state === 'ready' && s.t >= cook + win){
      s.state = 'burnt'; s.clearIn = 1.6;
      lose(costOf(s.cat === 'fill' ? {price:ING[s.type].price*s.qty} : slotItem(s)), '燒焦');
      mistake('burnt', pickAny(LINES.burnt), `${nameOf(s.type)}煎過頭了`);
      renderSlot(i);
    }
    if (s.state === 'burnt'){ s.clearIn -= dt; if (s.clearIn <= 0){ clearSlot(i); return; } }
    else cooking++;
    paintSlot(i, s, cook, win);
  });
  sfx.sizzle(cooking);
  $('#grill').classList.toggle('hot', cooking > 0);

  // 飲料
  let pouring = false;
  S.cups.forEach((c,i)=>{
    if (!c.pouring) return;
    pouring = true;
    c.level += dt * lerp(40, 52, t/GAME_LEN);
    if (c.level >= 100){
      c.level = 0; c.pouring = false; c.pid = null;
      const el = cupEls[i].cup; el.classList.remove('spill'); void el.offsetWidth; el.classList.add('spill');
      lose(10, '溢出');
      mistake('spill', pickAny(LINES.spill), `${DRINKS[c.type].name}倒太滿了`);
    }
    renderCup(i);
  });
  sfx.pour(pouring);
  updateTray();
  const left = GAME_LEN - t;
  const lvl = left <= 10 ? 3 : left <= 30 ? 2 : left <= 60 ? 1 : 0;
  const bpm = lvl ? lerp(172, 220, (60 - left) / 60) : lerp(138, 165, t / (GAME_LEN - 60));
  sfx.bgmTick(bpm, lvl);
  finalMinute(left, lvl);

  paintPatience();
  renderTimer();
  netTick();
  if (!guest && t >= GAME_LEN && !S.over) endGame(false, 'timeup');
}

async function getLobby(){
  if (NET.lobby) return NET.lobby;
  try {
    if (window.claude && window.claude.use) NET.lobby = await window.claude.use('room');

const FB_DB_URL = 'https://tw-breakfast-default-rtdb.asia-southeast1.firebasedatabase.app';
const FB_SDK = 'https://www.gstatic.com/firebasejs/10.12.2/';
// 做成跟 claude.ai 房間一樣的介面：join(name) → {presence, onPeers, leave}
async function firebaseLobby(){
  const [{initializeApp}, fdb] = await Promise.all([import(FB_SDK + 'firebase-app.js'), import(FB_SDK + 'firebase-database.js')]);
  const db = fdb.getDatabase(initializeApp({databaseURL: FB_DB_URL}));
  const myPeer = Math.random().toString(36).slice(2, 12).padEnd(8, '0');
  return {
    async join(name){
      const roomRef = fdb.ref(db, 'rooms/' + name), meRef = fdb.ref(db, 'rooms/' + name + '/' + myPeer);
      let mine = {}, peers = [], dead = false;
      const handlers = [], errs = [];
      const fail = e => { if (dead) return; dead = true; errs.forEach(f => f({code:'upstream_error', message:String(e && e.message || e)})); };
      await fdb.onDisconnect(meRef).remove();
      await fdb.set(meRef, '{}');
      const unsub = fdb.onValue(roomRef, snap => {
        const v = snap.val() || {};
        peers = Object.keys(v).map(peer => {
          let p = {}; try { p = JSON.parse(v[peer]) || {}; } catch(e){}
          return {peer, presence:p, sameTab:peer === myPeer, isMe:peer === myPeer, kind:'viewer', by:null, guest:false};
        });
        if (!peers.some(p => p.sameTab)) peers.push({peer:myPeer, presence:mine, sameTab:true, isMe:true, kind:'viewer', by:null, guest:false});
        handlers.forEach(h => h({peers, joined:[], left:[], updated:[]}));
      }, fail);
      return {
        name,
        presence(patch){
          mine = Object.assign({}, mine);
          for (const k in patch){ if (patch[k] === null) delete mine[k]; else mine[k] = patch[k]; }
          return fdb.set(meRef, JSON.stringify(mine));
        },
        onPeers(h, onErr){ handlers.push(h); if (onErr) errs.push(onErr); if (peers.length) setTimeout(() => h({peers, joined:[], left:[], updated:[]}), 0); return () => {}; },
        peers: () => peers,
        connected: () => !dead,
        async leave(){ dead = true; unsub(); await fdb.remove(meRef).catch(()=>{}); },
      };
    },
  };
}

  const label = NET.mode === 'coop' ? '🤝 雙人合作' : '🆚 雙人比賽';
  const rule = NET.mode === 'coop'
    ? '兩個人一起出同一張單，各自有自己的鍋子和飲料台。🍳 三次機會兩人共用，誰出錯都算，扣完一起倒店。單會比較大。'
    : '兩邊的訂單一模一樣。誰先出錯 3 次倒店就輸；先出完 20 單的人贏；5 分鐘到了比出單數，一樣多再比淨賺。';
  const me = NET.me, rv = NET.rival;
  const seat = (p, you) => p
    ? `<div class="seat">${you ? '<span class="you">你</span>' : ''}<span class="sn">${esc(String((p.presence && p.presence.shop) || '（還沒取名）').slice(0,10))}</span><span class="st ${p.presence && p.presence.ready ? 'ok' : ''}">${p.presence && p.presence.ready ? '準備好了' : '還沒準備'}</span></div>`
    : `<div class="seat empty"><span class="sn">等朋友加入…</span><span class="st">房號 ${esc(NET.code)}</span></div>`;
  showCard(`
    <h2>${label}｜房號 ${esc(NET.code)}</h2>
    <div class="seats">${seat(me || {presence:{shop:shopName, ready:NET.ready}}, true)}${NET.full ? '<div class="seat empty"><span class="sn">房間滿了</span></div>' : seat(rv, false)}</div>
    <p style="font-size:13px;line-height:1.55;text-align:left">${rule}</p>
    <p class="err">${NET.full ? '這個房號已經有兩個人了，換一組數字吧' : (!rv ? '把房號告訴朋友，請他選一樣的模式、輸入一樣的數字' : (NET.ready ? '等對方按準備…' : ''))}</p>
    <button class="cta" id="readyBtn" ${NET.full ? 'disabled' : ''}>${NET.ready ? '取消準備' : '準備好了！'}</button>
    <button class="ghostbtn" id="leaveBtn">離開房間</button>`);
  $('#readyBtn').onclick = () => { sfx.init(); setReady(!NET.ready); lobbyScreen(); };
  $('#leaveBtn').onclick = homeScreen;
}
function inLobby(){ return !!NET.room && !NET.counting && (!S.running || S.over) && !!$('#readyBtn'); }
function onPeers(ch){
  const all = ch.peers.filter(p => p.kind === 'viewer');
  const me = all.find(p => p.sameTab);
  if (!me) return;
  const players = all.slice().sort((a,b) => a.peer < b.peer ? -1 : a.peer > b.peer ? 1 : 0);
  const two = players.slice(0, 2);
  NET.full = !two.includes(me);
  const prevRival = NET.rival;
  NET.me = me;
  NET.rival = NET.full ? null : (two.find(p => p !== me) || null);
  NET.host = !NET.rival || me.peer < NET.rival.peer;
  const rv = NET.rival, rp = rv ? rv.presence || {} : {};
  const hostP = NET.host ? me.presence || {} : rp;

  // 開局：房主看到兩人都準備好，就丟出種子
  if (NET.host && rv && NET.ready && rp.ready && !NET.counting && !NET.startSent && (!S.running || S.over)){
    NET.startSent = true;
    pres({start:{id:Math.random().toString(36).slice(2, 10), seed:(Math.random()*4294967296) >>> 0, a:me.peer, b:rv.peer}});
  }
  const st = hostP.start;
  if (st && st.id && st.id !== NET.startId && rv && NET.ready && !NET.counting && (!S.running || S.over)
      && [st.a, st.b].includes(me.peer) && [st.a, st.b].includes(rv.peer)){
    NET.startId = st.id; countdown(st.seed);
    return;
  }

  if (S.running && !S.over && S.mode !== 'solo'){
    if (!rv && prevRival){ rivalLeft(); return; }
    if (S.mode === 'vs'){
      if (rp.st && rp.st.g === NET.startId){ NET.rivalSt = rp.st; checkVs(); }
    } else if (S.role === 'host'){
      const a = rp.acts;
      if (a && a.g === NET.startId) hostProcess(a.a);
    } else if (rp.cs && rp.cs.g === NET.startId) applyCS(rp.cs);
    renderRival();
  } else if (S.over && S.mode === 'vs' && S.vsOver === 'time' && rp.st && rp.st.g === NET.startId){
    NET.rivalSt = rp.st; vsResolve();
  } else if (S.over && S.mode === 'coop' && S.role === 'guest' && rp.cs && rp.cs.g === NET.startId){
    // 已經結束，不用再處理
  }
  if (inLobby()) lobbyScreen();
}
function countdown(sd){
  NET.counting = true;
  NET.ready = false; pres({ready:false});
  let n = 3;
  const tick = () => {
    if (n > 0){ showCard(`<p class="big">${NET.mode === 'coop' ? '一起開店！' : '準備比賽！'}</p><div class="countdown">${n}</div>`); sfx.tick(); n--; setTimeout(tick, 800); }
    else {
      NET.counting = false;
      NET.vsShown = false; NET.startSent = false;
      NET.seq = 0; NET.acts = []; NET.seenSeq = 0; NET.fx = []; NET.fxN = 0; NET.lastFx = 0; NET.rivalSt = null; NET.lastQ = ''; NET.lastPub = '';
      startGame({mode:NET.mode, seed:sd, role: NET.mode === 'coop' ? (NET.host ? 'host' : 'guest') : null});
      pres({cs:null, acts:null, st:null});
    }
  };
  tick();
}
// 遊戲中把自己的狀態放進 presence（每秒約 8 次，有變才送）
function netTick(force){
  if (!NET.room || !S || S.mode === 'solo') return;
  const now = performance.now();
  if (!force && now - NET.pubT < 120) return;
  let patch;
  if (S.mode === 'vs') patch = {st:{g:NET.startId, sv:S.served, lv:S.lives, net:S.income - S.loss, over:S.vsOver || 0, shop:shopName}};
  else if (S.role === 'host') patch = {cs:buildCS()};
  else patch = {acts:{g:NET.startId, a:NET.acts}};
  const j = JSON.stringify(patch);
  if (j === NET.lastPub) return;
  NET.lastPub = j; NET.pubT = now;
  pres(patch);
}
function buildCS(){
  const c = S.queue[0];
  return {g:NET.startId, t:Math.round(S.gt*10)/10, sv:S.served, lv:S.lives, i:S.income, l:S.loss, shop:shopName,
    q: c ? {id:c.id, ty:c.type, wh:c.where, hd:c.hidden?1:0, fr:c.free?1:0, p:Math.round(c.p*10)/10, mp:Math.round(c.maxP*10)/10,
      o:c.order.map(o=>[o.kind, o.type, o.tops, o.size||0, o.sugar||0, o.changed?1:0]), d:c.done.map(x=>x?1:0)} : null,
    fx:NET.fx, res:S.result || null};
}
function hostProcess(acts){
  for (const a of acts || []){
    if (!(a.s > NET.seenSeq)) continue;
    NET.seenSeq = a.s;
    if (S.over) continue;
    if (a.k === 'd' && Array.isArray(a.it)){
      const [kind, type, tops, size, sugar] = a.it;
      if (!(MAINS[type] || SIDES[type] || DRINKS[type])) continue;
      deliver(makeItem(kind, type, (tops||[]).filter(t=>ING[t]), size || undefined, sugar || undefined), true);
    } else if (a.k === 'm' && OOPS_EMOJI_KINDS.includes(a.kind)) mistake(a.kind, String(a.l||'').slice(0,40), String(a.sub||'').slice(0,40));
    else if (a.k === 'loss') lose(Math.max(0, Math.min(200, +a.n || 0)), String(a.lb||'').slice(0,6));
    else if (a.k === 'peek') doPeek();
  }
}
const OOPS_EMOJI_KINDS = ['wrong','burnt','spill','leave'];
function applyCS(cs){
  S.gt = cs.t || 0;
  if (S.served !== cs.sv || S.lives !== cs.lv){ S.served = cs.sv; S.lives = cs.lv; renderHUD(); }
  if (S.income !== cs.i || S.loss !== cs.l){ S.income = cs.i; S.loss = cs.l; renderLedger(); }
  const q = cs.q;
  const key = q ? JSON.stringify([q.id, q.hd, q.fr, q.o, q.d]) : '';
  if (key !== NET.lastQ){
    const prevId = S.queue[0] && S.queue[0].id;
    NET.lastQ = key;
    if (q){
      const c = {id:q.id, type:q.ty, where:q.wh, hidden:!!q.hd, free:!!q.fr, p:q.p, maxP:q.mp,
        order:q.o.map(a=>{ const it = makeItem(a[0], a[1], a[2], a[3] || undefined, a[4] || undefined); if (a[5]) it.changed = true; return it; }),
        done:q.d.map(Boolean)};
      S.queue = [c];
      if (q.id !== prevId){ sfx.chime(); const tk = $('#ticket'); tk.classList.remove('pop'); void tk.offsetWidth; tk.classList.add('pop'); }
    } else S.queue = [];
    renderTicket();
  } else if (q && S.queue[0]) S.queue[0].p = q.p;
  for (const f of cs.fx || []){
    if (!(f.n > NET.lastFx)) continue;
    NET.lastFx = f.n;
    if (f.a === 'oops'){
      sfx.buzz();
      if (navigator.vibrate) try { navigator.vibrate([80,40,80]); } catch(e){}
      const fl = $('#flash'); fl.classList.remove('on'); void fl.offsetWidth; fl.classList.add('on');
      oops(f.k, f.l, f.s);
    }
    else if (f.a === 'fl') floater(f.x, f.b);
    else if (f.a === 'say') custSay0(f.x);
    else if (f.a === 'toast') toast(f.x);
    else if (f.a === 'snd' && sfx[f.v]) sfx[f.v]();
  }
  if (cs.res && !S.over){ stopAll(); S.result = cs.res; showEnd(cs.res); }
}
function renderRival(){
  const el = $('#rival');
  if (!S || S.mode === 'solo'){ el.hidden = true; return; }
  el.hidden = false;
  const rv = NET.rival, rp = rv ? rv.presence || {} : null;
  if (!rv){ el.innerHTML = `<span class="off">${S.mode === 'coop' ? '🤝 隊友離線了' : '🆚 對手離線了'}</span>`; return; }
  if (S.mode === 'coop'){ el.innerHTML = `🤝 隊友：<b>${esc(String(rp.shop || '').slice(0,10))}</b>　${NET.host ? '你是房主' : '單子由房主出'}`; return; }
  const st = NET.rivalSt;
  if (!st){ el.innerHTML = `🆚 <b>${esc(String(rp.shop || '對手').slice(0,10))}</b>　準備中…`; return; }
  let lv = ''; for (let i=0;i<LIVES;i++) lv += i < st.lv ? '🍳' : '<span class="off">🍳</span>';
  el.innerHTML = `🆚 <b>${esc(String(st.shop || rp.shop || '對手').slice(0,10))}</b><span>${st.sv}/${GOAL}</span><span>${lv}</span><span>${st.net < 0 ? '-' : ''}$${Math.abs(st.net)}</span>`;
}
function rivalLeft(){
  renderRival();
  if (S.mode === 'vs'){ toast('對手離開了，你自己繼續玩'); return; }
  if (S.role === 'host'){ toast('隊友離開了，你一個人撐下去！'); return; }
  stopAll();
  showCard(`<div class="mascot">${mascot('leave')}</div><h2>房主離開了</h2><p class="big">這局先到這裡，訂單都在房主那邊。</p><button class="cta" id="againBtn">回到房間</button><button class="ghostbtn" id="renameBtn">回首頁</button>`);
  $('#againBtn').onclick = lobbyScreen; $('#renameBtn').onclick = homeScreen;
}
// 比賽：對手倒店或先完成，馬上結束
function checkVs(){
  const o = NET.rivalSt && NET.rivalSt.over;
  if (S.over || !o) return;
  if (o === 'dead'){ stopAll(); S.vsOver = 'rivaldead'; netTick(true); vsResolve(); }
  else if (o === 'done'){ stopAll(); S.vsOver = 'rivaldone'; netTick(true); vsResolve(); }
}
function vsResolve(){
  if (NET.vsShown) return;
  const me = S.vsOver, rv = NET.rivalSt, ro = rv && rv.over;
  let win = null, why = '';
  if (me === 'dead'){ win = false; why = '你先出錯 3 次，倒店了…'; }
  else if (me === 'done'){ win = true; why = '你先出完 20 單！'; }
  else if (me === 'rivaldead'){ win = true; why = '對手先倒店了！你撐到最後！'; }
  else if (me === 'rivaldone'){ win = false; why = '對手先出完 20 單了…'; }
  else if (me === 'time'){
    if (!NET.rival || !rv){ win = true; why = '時間到，對手不在了'; }
    else if (ro === 'dead'){ win = true; why = '對手先倒店了！'; }
    else if (ro === 'done'){ win = false; why = '對手先出完 20 單了…'; }
    else if (ro !== 'time'){
      showCard(`<div class="mascot">${mascot('leave')}</div><h2>打烊了！</h2><p class="big">等對手結算…</p>`); return;
    } else {
      const myNet = S.income - S.loss;
      if (S.served !== rv.sv){ win = S.served > rv.sv; why = `時間到，比出單數：${S.served} 對 ${rv.sv}`; }
      else if (myNet !== rv.net){ win = myNet > rv.net; why = `出單一樣多，比淨賺：$${myNet} 對 $${rv.net}`; }
      else { win = null; why = '出單和淨賺都一樣，平手！'; }
    }
  }
  const r = rv || {sv:'-', net:0, lv:'-', shop:'對手'};
  const myNet = S.income - S.loss;
  const row = (k, a, b) => `<tr><td>${k}</td><td>${a}</td><td>${b}</td></tr>`;
  const money = n => (n < 0 ? '-$' : '$') + Math.abs(n);
  NET.vsShown = true;
  if (win === true) sfx.win(); else if (win === false) sfx.lose();
  showCard(`<div class="mascot">${mascot(win === false ? 'lose' : 'win')}</div>
    <h2>${win === true ? '你贏了！' : win === false ? '你輸了…' : '平手！'}</h2>
    <p class="big">${why}</p>
    <table class="vsTable"><tr><th></th><th>你｜${esc(shopName)}</th><th>對手｜${esc(String(r.shop||'對手').slice(0,10))}</th></tr>
      ${row('出單', `${S.served}/${GOAL}`, `${r.sv}/${GOAL}`)}${row('淨賺', money(myNet), money(r.net||0))}${row('剩下 🍳', S.lives, r.lv)}</table>
    ${endButtons('','')}`);
  wireEndButtons();
}

$('#pauseBtn').onclick = () => pause(!(S && S.paused));
$('#muteBtn').onclick = () => {
  soundOn = !soundOn; sfx.mute(soundOn);
  $('#muteBtn').textContent = soundOn ? '🔊' : '🔇';
};
document.addEventListener('visibilitychange', () => { if (document.hidden && S && S.mode === 'solo') pause(true); });

/* ================= 啟動 ================= */
S = freshState();
setShopName(shopName);
buildKitchen();
S.slots.forEach((_,i)=>renderSlot(i)); S.board.forEach((_,i)=>renderBoard(i)); S.cups.forEach((_,i)=>renderCup(i)); renderTray();
renderHUD(); renderTicket(); renderTimer(); renderLedger();
homeScreen();
requestAnimationFrame(loop);
})();
</script>
