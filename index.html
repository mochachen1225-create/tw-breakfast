<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>帥哥美女早餐店</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
/* Layout: 一個手機畫面。上 = 點單＋帳本，下 = 廚房（煎台 / 工作台 / 食材 / 飲料）。單一主題：早餐店招牌風 */
:root{
  --cream:#FFF4E0;      /* 牆面 */
  --paper:#FFFDF7;      /* 點單紙 */
  --tomato:#E4572E;     /* 招牌紅 */
  --tomato-dk:#B83E1C;
  --yolk:#F6B93B;       /* 蛋黃 */
  --scallion:#5FA33E;   /* 蔥花綠 */
  --steel:#3A3F47;      /* 煎台/盤子 */
  --steel-dk:#2A2E35;
  --wood:#D9A066;       /* 櫃台、砧板 */
  --wood-dk:#B97F45;
  --ink:#3B2A20;        /* 文字 */
  --ink-soft:#7A6455;
  --display:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{background:var(--cream);color:var(--ink);font-family:var(--body);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
button:focus-visible{outline:3px solid var(--yolk);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column;max-width:520px;margin:0 auto;position:relative;
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));box-sizing:border-box}

/* ---------- 招牌 ---------- */
.hud{flex:0 0 auto;display:flex;align-items:center;gap:8px;background:var(--tomato);color:#fff;
  margin:0 -10px;padding:6px 12px;border-bottom:4px solid var(--tomato-dk)}
.sign{font-family:var(--display);font-size:15px;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;text-shadow:0 2px 0 var(--tomato-dk)}
.stats{margin-left:auto;display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums;font-weight:700;font-size:14px;flex:0 0 auto}
.pill{background:rgba(0,0,0,.18);border-radius:999px;padding:2px 8px;white-space:nowrap}
#timer.hurry{background:var(--yolk);color:var(--ink);animation:pulse .6s infinite alternate}
#lives{letter-spacing:-2px;white-space:nowrap;font-size:13px}
#lives .gone{filter:grayscale(1);opacity:.35}
.iconbtn{width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.18);font-size:15px;display:grid;place-items:center}

/* ---------- 點單 ---------- */
.front{flex:0 0 auto;display:flex;flex-direction:column;position:relative;padding-top:8px;gap:5px}
.pbar{height:8px;border-radius:4px;background:rgba(59,42,32,.15);overflow:hidden;flex:1}
.pbar i{display:block;height:100%;width:100%;background:var(--scallion);border-radius:4px;transform-origin:left}
.ticket{background:var(--paper);border-radius:6px;box-shadow:0 3px 0 rgba(59,42,32,.15);padding:6px 10px 8px;
  display:flex;flex-direction:column;gap:5px;position:relative;min-height:82px;box-sizing:border-box;
  border-top:6px dashed var(--cream);background-image:repeating-linear-gradient(transparent 0 27px,rgba(228,87,46,.10) 27px 28px)}
.ticket.pop{animation:hop .3s ease-out}
.ticket.mad{animation:shake .3s}
.tk-head{font-family:var(--display);font-size:13px;color:var(--tomato);display:flex;align-items:center;gap:8px}
.tk-head .who{font-size:16px}
.tk-head .sum{color:var(--ink);font-variant-numeric:tabular-nums}
.tk-items{display:flex;flex-wrap:wrap;gap:4px 12px;align-content:flex-start}
.tk-item{display:flex;align-items:center;gap:5px;font-size:14px;font-weight:700;line-height:1.15}
.tk-item .pr{color:var(--ink-soft);font-size:11px;margin-left:3px;font-variant-numeric:tabular-nums}
.tk-item small{display:block;font-weight:700;color:var(--tomato-dk);font-size:11.5px}
.tk-item.done{opacity:.4;text-decoration:line-through}
.tk-item.changed{animation:flashBg 1s 3}
.mini{width:30px;height:30px;border-radius:50%;background:var(--steel);display:grid;place-items:center;flex:0 0 auto}
.mini svg{width:24px;height:24px}
.free{position:absolute;right:8px;bottom:6px;transform:rotate(-14deg);border:3px solid var(--tomato);color:var(--tomato);
  font-family:var(--display);font-size:20px;padding:0 6px;border-radius:6px;opacity:.85}
.secret{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:2px;cursor:pointer}
.secret b{font-family:var(--display);font-size:20px;color:var(--tomato)}
.secret small{font-size:11px;color:var(--ink-soft)}
.waiting{margin:auto;color:var(--ink-soft);font-size:13px}
.ledger{display:flex;gap:10px;justify-content:space-between;font-size:12.5px;font-weight:700;color:var(--ink-soft);font-variant-numeric:tabular-nums;padding:0 2px}
.ledger b{font-size:14px}
.ledger .in b{color:var(--scallion)}
.ledger .out b{color:var(--tomato)}
.ledger .net{background:var(--yolk);color:var(--ink);border-radius:999px;padding:0 10px}
.ledger .net.neg{background:var(--tomato);color:#fff}
.ledger .bump{animation:pulse .15s 2 alternate}

.say{position:absolute;z-index:5;background:#fff;border-radius:12px;padding:5px 10px;font-weight:900;font-size:14px;
  box-shadow:0 3px 0 rgba(59,42,32,.18);white-space:nowrap;pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .15s,transform .15s}
.say.show{opacity:1;transform:none}
#bossSay{right:4px;top:-4px;background:var(--yolk);color:var(--ink)}
#custSay{right:6px;top:30px;background:var(--tomato);color:#fff;max-width:70%;white-space:normal}

/* ---------- 廚房 ---------- */
.kitchen{flex:1 1 auto;display:flex;flex-direction:column;gap:6px;padding:6px 0 max(8px,env(safe-area-inset-bottom,0px));min-height:0}
.grill{flex:1 1 0;min-height:150px;background:linear-gradient(#4A505A,var(--steel));border-radius:14px;padding:8px;display:grid;
  grid-template-columns:repeat(3,1fr);grid-template-rows:1fr 1fr;gap:8px;place-items:center;
  box-shadow:inset 0 0 0 2px #23272d,0 4px 0 #23272d;position:relative}
.grill.hot{box-shadow:inset 0 0 0 2px #23272d,inset 0 0 22px rgba(246,120,40,.35),0 4px 0 #23272d}
.slot{height:100%;max-height:100%;aspect-ratio:1;max-width:100%;min-height:0;position:relative;border-radius:50%;background:var(--steel-dk);display:grid;place-items:center;box-sizing:border-box}
.slot .ring{position:absolute;inset:-3px;border-radius:50%;
  background:conic-gradient(var(--rc,var(--yolk)) calc(var(--p,0)*1turn),transparent 0);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 5px));
          mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 5px))}
.slot .food{width:80%;height:80%;display:grid;place-items:center}
.slot .food svg{width:100%;height:100%;display:block}
.slot.sel{box-shadow:0 0 0 3px var(--paper),0 0 0 6px var(--yolk)}
.slot.ready .food{animation:bob .5s infinite alternate}
.slot.warn .ring{animation:blink .25s infinite alternate}
.slot .empty{color:rgba(255,255,255,.2);font-size:13px;font-weight:700}
.slot .toss{position:absolute;right:0;top:0;width:24px;height:24px;border-radius:50%;background:var(--paper);color:var(--ink);font-size:11px;font-weight:900;
  box-shadow:0 2px 0 rgba(0,0,0,.3);display:none;place-items:center}
.slot.has .toss{display:grid}
.slot .smoke{position:absolute;inset:0;pointer-events:none}
.slot .smoke.on::before,.slot .smoke.on::after{content:"💨";position:absolute;left:30%;top:10%;font-size:26px;animation:rise 1.2s ease-out infinite}
.slot .smoke.on::after{left:55%;animation-delay:.4s}
.slot .tops{position:absolute;bottom:-5px;left:50%;transform:translateX(-50%);display:flex;flex-wrap:wrap;justify-content:center;gap:1px;width:120%}
.slot .tops b{font-size:10px;background:var(--paper);color:var(--ink);border-radius:4px;padding:0 3px;white-space:nowrap}
.slot .hint{position:absolute;top:-4px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:900;color:#fff;background:var(--scallion);border-radius:4px;padding:0 4px;white-space:nowrap}

.boards{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.board{position:relative;height:62px;border-radius:10px;background:var(--wood);box-shadow:inset 0 0 0 2px var(--wood-dk),0 3px 0 var(--wood-dk);
  display:flex;align-items:center;gap:4px;padding:4px 6px;box-sizing:border-box;min-width:0;
  background-image:repeating-linear-gradient(90deg,transparent 0 18px,rgba(185,127,69,.25) 18px 19px)}
.board.sel{box-shadow:inset 0 0 0 2px var(--wood-dk),0 0 0 3px var(--paper),0 0 0 6px var(--yolk)}
.board .bimg{width:46px;height:46px;flex:0 0 auto}
.board .bimg svg{width:100%;height:100%}
.board .btags{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:2px;align-content:center}
.board .btags b{font-size:10.5px;background:var(--paper);border-radius:4px;padding:0 3px;white-space:nowrap}
.board .bname{font-weight:900;font-size:13px;width:100%}
.board .empty{margin:auto;font-size:12px;font-weight:700;color:rgba(59,42,32,.45)}
.board .bbtns{display:flex;flex-direction:column;gap:4px;flex:0 0 auto}
.board .bbtns button{width:40px;height:24px;border-radius:7px;font-size:12px;font-weight:900;background:var(--paper);box-shadow:0 2px 0 rgba(0,0,0,.2)}
.board .bbtns .send{background:var(--scallion);color:#fff}

.ings{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.ing{border-radius:10px;font-weight:900;font-size:12px;min-height:40px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
  background:var(--paper);box-shadow:0 3px 0 #D8C3A5;line-height:1.1;padding:2px 0;transition:transform .05s}
.ing svg{width:22px;height:22px}
.ing.g{background:#4A505A;color:#fff;box-shadow:0 3px 0 #23272d}
.ing.g span::after{content:"🔥";font-size:8px;vertical-align:super}
.ing.b{background:#F3D3A6;box-shadow:0 3px 0 var(--wood-dk)}
.ing.c{min-height:32px;flex-direction:row;gap:4px;border-radius:999px}
.ing.c i{width:11px;height:11px;border-radius:50%;display:inline-block;box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.18)}
.ing.s{background:#F0DEC6}
.ing.press,.ing:active{transform:translateY(2px);box-shadow:none}
.shake{animation:shake .3s}

.cups{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.station{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.cup{position:relative;width:100%;height:clamp(50px,8.5vh,80px);touch-action:none}
.cup .glass{position:absolute;inset:0;clip-path:polygon(6% 0,94% 0,80% 100%,20% 100%);background:rgba(255,255,255,.8);
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.1)}
.cup .liq{position:absolute;left:0;right:0;bottom:0;height:0}
.cup .band{position:absolute;left:0;right:0;border-top:2px dashed rgba(59,42,32,.45);border-bottom:2px dashed rgba(59,42,32,.45);background:rgba(95,163,62,.12)}
.cup .band span{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:9px;font-weight:900;color:var(--ink-soft)}
.cup .nozzle{position:absolute;left:50%;top:-6px;width:8px;height:0;transform:translateX(-50%);border-radius:0 0 4px 4px}
.cup.pouring .nozzle{height:calc(100% - var(--lv,0%) + 6px)}
.cup.pouring{transform:scale(.97)}
.cup.spill .glass{animation:shake .3s}
.drinkName{font-weight:900;font-size:12px}
.cupBtns{display:flex;gap:3px;width:100%}
.cupBtns button{flex:1;border-radius:7px;font-weight:900;font-size:11.5px;min-height:28px;background:var(--paper);box-shadow:0 2px 0 #D8C3A5}
.cupBtns .send{background:var(--scallion);color:#fff;box-shadow:0 2px 0 #3E7525}
.cupBtns button:disabled{opacity:.35}

/* ---------- 浮動提示 ---------- */
#oops{position:absolute;inset:0;z-index:25;display:flex;align-items:center;justify-content:center;pointer-events:none;margin:0 -10px;padding:16px}
#oops .oc{background:var(--paper);border:4px solid var(--yolk);border-radius:22px;padding:16px 18px 14px;text-align:center;max-width:320px;width:100%;
  box-shadow:0 10px 0 rgba(59,42,32,.18);transform:scale(.4) rotate(-6deg);opacity:0}
#oops.show .oc{animation:oopsIn .38s cubic-bezier(.2,1.6,.4,1) forwards}
#oops.hide .oc{transform:none;opacity:1;animation:oopsOut .25s ease-in forwards}
#oops .oe{font-size:56px;line-height:1.1}
#oops .ol{font-family:var(--display);font-size:26px;line-height:1.3;color:var(--ink);text-wrap:balance}
#oops .os{margin-top:6px;font-weight:700;font-size:14px;color:var(--tomato)}
@keyframes oopsIn{0%{transform:scale(.4) rotate(-6deg);opacity:0}100%{transform:scale(1) rotate(-2deg);opacity:1}}
@keyframes oopsOut{to{transform:scale(.8) translateY(30px);opacity:0}}
#toast{position:absolute;left:50%;top:30%;transform:translate(-50%,-50%);background:var(--ink);color:#fff;font-weight:900;padding:8px 14px;border-radius:12px;
  font-size:15px;opacity:0;pointer-events:none;transition:opacity .15s;z-index:20;text-align:center;max-width:85%}
#toast.show{opacity:.92}
#flash{position:absolute;inset:0;background:var(--tomato);opacity:0;pointer-events:none;z-index:19;margin:0 -10px}
#flash.on{animation:flash .45s}
.floater{position:absolute;z-index:21;font-family:var(--display);font-size:20px;color:var(--scallion);pointer-events:none;animation:floatUp 1.1s ease-out forwards;text-shadow:0 2px 0 #fff;white-space:nowrap}
.floater.bad{color:var(--tomato)}

/* ---------- 覆蓋畫面 ---------- */
.overlay{position:absolute;inset:0;z-index:30;background:rgba(59,42,32,.55);display:flex;align-items:center;justify-content:center;margin:0 -10px;padding:16px;overflow-y:auto}
.card{background:var(--cream);border-radius:20px;padding:18px 16px;width:100%;max-width:360px;text-align:center;box-shadow:0 8px 0 rgba(0,0,0,.2);
  display:flex;flex-direction:column;gap:11px;border:4px solid var(--tomato);margin:auto}
.card h1{font-family:var(--display);font-size:30px;margin:0;color:var(--tomato);text-wrap:balance;line-height:1.15}
.card h2{font-family:var(--display);font-size:26px;margin:0;color:var(--tomato);text-wrap:balance}
.card p{margin:0;line-height:1.55;font-size:14px}
.card .big{font-family:var(--display);font-size:19px;line-height:1.45;color:var(--ink)}
.card ul{text-align:left;margin:0;padding-left:20px;font-size:13px;line-height:1.55}
.namerow{display:flex;gap:8px;align-items:center}
.namerow label{font-weight:900;font-size:14px;white-space:nowrap}
.namerow input{flex:1;min-width:0;font:inherit;font-family:var(--display);font-size:20px;color:var(--ink);background:var(--paper);border:3px solid var(--wood);border-radius:12px;padding:6px 10px;
  -webkit-user-select:text;user-select:text;touch-action:auto}
.namerow input:focus{outline:none;border-color:var(--tomato)}
#dice{width:48px;height:48px;font-size:28px;border-radius:12px;background:var(--yolk);box-shadow:0 4px 0 #C98D16;flex:0 0 auto}
#dice.roll{animation:roll .5s ease-out}
.cta{background:var(--tomato);color:#fff;font-family:var(--display);font-size:22px;border-radius:14px;padding:12px;box-shadow:0 5px 0 var(--tomato-dk)}
.cta:active{transform:translateY(3px);box-shadow:0 2px 0 var(--tomato-dk)}
.ghostbtn{font-weight:700;color:var(--ink-soft);font-size:13px;text-decoration:underline}
.titleBadge{background:var(--yolk);border-radius:14px;padding:10px;font-family:var(--display);font-size:26px;color:var(--ink);box-shadow:0 4px 0 #C98D16}
.books{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-variant-numeric:tabular-nums}
.books div{background:var(--paper);border-radius:10px;padding:6px 0;font-size:12px;font-weight:700;color:var(--ink-soft)}
.books b{display:block;font-family:var(--display);font-size:20px;color:var(--ink)}
.stat{display:flex;justify-content:center;gap:14px;font-size:13px;font-weight:700;color:var(--ink-soft);font-variant-numeric:tabular-nums;flex-wrap:wrap}

@keyframes hop{0%{transform:translateY(16px) scale(.8);opacity:0}100%{transform:none;opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes bob{to{transform:translateY(-3px) scale(1.04)}}
@keyframes blink{to{opacity:.25}}
@keyframes pulse{to{transform:scale(1.08)}}
@keyframes rise{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-26px);opacity:0}}
@keyframes flash{0%{opacity:.45}100%{opacity:0}}
@keyframes floatUp{to{transform:translateY(-40px);opacity:0}}
@keyframes flashBg{50%{background:var(--yolk)}}
@keyframes roll{0%{transform:rotate(0)}100%{transform:rotate(720deg)}}
@media (max-width:385px){.sign{font-size:12px;letter-spacing:0}.pill{padding:2px 6px}.stats{gap:4px;font-size:13px}.iconbtn{width:26px;height:26px}.ing{font-size:11px}}
@media (max-height:700px){.grill{min-height:110px}.kitchen{gap:5px}.ing{min-height:36px}.ing svg{width:18px;height:18px}.ing.c{min-height:28px}.board{height:52px}.board .bimg{width:38px;height:38px}.ticket{min-height:72px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<div id="app">
  <header class="hud">
    <div class="sign" id="sign">帥哥美女早餐店</div>
    <div class="stats">
      <span class="pill" id="timer">5:00</span>
      <span class="pill" id="served">0/20</span>
      <span id="lives"></span>
      <button class="iconbtn" id="muteBtn" aria-label="聲音開關">🔊</button>
      <button class="iconbtn" id="pauseBtn" aria-label="暫停">Ⅱ</button>
    </div>
  </header>

  <section class="front">
    <div class="say" id="bossSay"></div>
    <div class="say" id="custSay"></div>
    <div class="ticket" id="ticket"></div>
    <div class="ledger">
      <span class="in">收 <b id="inc">$0</b></span>
      <span class="out">賠 <b id="loss">$0</b></span>
      <span class="net" id="netWrap">淨賺 <b id="net">$0</b></span>
    </div>
  </section>

  <section class="kitchen">
    <div class="grill" id="grill"></div>
    <div class="boards" id="boards"></div>
    <div class="ings" id="ings"></div>
    <div class="cups" id="cups"></div>
  </section>

  <div id="toast"></div>
  <div id="flash"></div>
  <div id="oops"><div class="oc"><div class="oe"></div><div class="ol"></div><div class="os"></div></div></div>

  <div class="overlay" id="overlay">
    <div class="card" id="card"></div>
  </div>
</div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);

/* ================= 亂數（用種子，之後雙人對戰可以讓兩邊訂單一樣） ================= */
let seed = 1;
function rand(){ seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }
const rnd = (a,b) => a + rand()*(b-a);
const ri = (a,b) => Math.floor(rnd(a,b+1));
const pick = a => a[Math.floor(rand()*a.length)];
const pickAny = a => a[Math.floor(Math.random()*a.length)];   // 純裝飾用，不影響對局
const clamp01 = t => Math.max(0,Math.min(1,t));
const lerp = (a,b,t) => a+(b-a)*clamp01(t);

/* ================= 菜單與食材 ================= */
const GAME_LEN = 300, GOAL = 20, LIVES = 3, COST_RATE = .4;
// 夾料：cooked = 要先上煎台；sauce = 鐵板麵醬
const ING = {
  pork:    {name:'肉鬆',  price:10, color:'#B5743A'},
  cheese:  {name:'起司',  price:10, color:'#FFB627'},
  corn:    {name:'玉米',  price:10, color:'#FFE15A'},
  tuna:    {name:'鮪魚',  price:15, color:'#E8C3A8'},
  ham:     {name:'火腿',  price:10, color:'#F49AA0'},
  lettuce: {name:'生菜',  price:5,  color:'#7CC35A'},

function makeItem(kind, type, tops, size){
  tops = (tops||[]).slice();
  let label, sub = '', price;
  if (kind === 'main'){
    price = MAINS[type].price + tops.reduce((a,t)=>a+ING[t].price, 0);
    label = (type==='egg_pancake' && !tops.length) ? '原味蛋餅' : MAINS[type].name;
    sub = tops.map(t=>ING[t].name).join('、');
  } else if (kind === 'side'){
    price = SIDES[type].price; label = SIDES[type].name;
    if (type === 'noodle') sub = tops.length ? ING[tops[0]].name+'醬' : '還沒加醬';
  } else {
    price = SIZES[size] ? SIZES[size].price : 0;
    label = (SIZES[size] ? SIZES[size].name : '怪') + '杯' + DRINKS[type].name;
  }
  return {kind, type, tops, size, label, sub, price};
}
const costOf = it => Math.max(3, Math.round(it.price * COST_RATE));

// 比對：exact 剛好、over 給多了（收訂單的錢，差額算賠）、under 少給（免費）
function compare(want, made){
  if (want.kind !== made.kind || want.type !== made.type) return null;
  if (want.kind === 'drink'){
    if (made.size === want.size) return 'exact';
    return (want.size === 'M' && made.size === 'L') ? 'over' : 'under';
  }
  if (want.kind === 'side') return (want.type !== 'noodle' || want.tops[0] === made.tops[0]) ? 'exact' : 'under';
  if (!want.tops.every(t=>made.tops.includes(t))) return 'under';
  return made.tops.length === want.tops.length ? 'exact' : 'over';
}

function pickFill(type, n){
  const pool = MAINS[type].fill.slice(), out = [];
  for (let i=0;i<n && pool.length;i++) out.push(pool.splice(Math.floor(rand()*pool.length),1)[0]);
  return out;
}
function randomItem(t){
  const table = t < 40
    ? [['egg_pancake',4],['toast',2],['drink',4],['hashbrown',1]]
    : [['egg_pancake',3],['toast',1.6],['burger',1.4],['riceball',1.4],['drink',4.5],['radish',1],['noodle',1],['hotdog',.8],['hashbrown',.8]];
  let r = rand()*table.reduce((a,b)=>a+b[1],0), k = table[0][0];
  for (const [name,w] of table){ if ((r-=w) <= 0){ k = name; break; } }
  if (MAINS[k]){
    const hi = t < 60 ? 1 : t < 160 ? 2 : 3;
    const lo = k === 'egg_pancake' ? 0 : 1;
    return makeItem('main', k, pickFill(k, ri(lo, Math.max(lo,hi))));
  }
  if (k === 'drink') return makeItem('drink', pick(Object.keys(DRINKS)), [], rand()<.5?'M':'L');
  if (k === 'noodle') return makeItem('side','noodle',[rand()<.5?'pepper':'mush']);
  return makeItem('side', k, []);
}
function genOrder(t, n){
  if (!n){ const lo = t < 50 ? 1 : 2, hi = t < 50 ? 2 : t < 150 ? 3 : 4; n = ri(lo, hi); }
  const items = [];
  while (items.length < n) items.push(randomItem(t));
  return items;
}

/* ================= 聲音：滋滋聲、燈燈燈、背景音樂 ================= */
let soundOn = true;
const sfx = (() => {
  let ac, master, sizzleG, pourG;
  const bgm = {on:false, next:0, step:0};
  const MELODY = [76,0,79,0,81,79,76,0, 74,0,76,79,76,0,74,0, 72,0,74,0,76,79,81,0, 79,76,74,0,72,0,0,0];
  const BASS = [48,43,45,43];
  const midi = n => 440 * Math.pow(2, (n-69)/12);
  function init(){
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    ac = new AC(); master = ac.createGain(); master.gain.value = soundOn ? 1 : 0; master.connect(ac.destination);
    const len = ac.sampleRate * 2, buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
    for (let i=0;i<len;i++) d[i] = Math.random()*2-1;
    const s1 = ac.createBufferSource(); s1.buffer = buf; s1.loop = true;
    const hp = ac.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=2200;
    const pk = ac.createBiquadFilter(); pk.type='peaking'; pk.frequency.value=5500; pk.gain.value=8;
    sizzleG = ac.createGain(); sizzleG.gain.value = 0;
    s1.connect(hp).connect(pk).connect(sizzleG).connect(master); s1.start();
    const s2 = ac.createBufferSource(); s2.buffer = buf; s2.loop = true; s2.playbackRate.value = .6;
    const lp = ac.createBiquadFilter(); lp.type='bandpass'; lp.frequency.value=700; lp.Q.value=1.4;
    pourG = ac.createGain(); pourG.gain.value = 0;
    s2.connect(lp).connect(pourG).connect(master); s2.start();
  }
  function tone(f, dur, type='sine', vol=.18, delay=0, slide){
    if (!ac) return;
    const t0 = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, t0+dur);
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(.0001, t0+dur);
    o.connect(g).connect(master); o.start(t0); o.stop(t0+dur+.02);
  }
  return {
    init,
    mute(on){ if (master) master.gain.value = on ? 1 : 0; },
    sizzle(n){ if (!sizzleG) return; const v = n ? Math.min(.22, .06 + n*.035) * (.6 + Math.random()*.8) : 0; sizzleG.gain.setTargetAtTime(v, ac.currentTime, .03); },
    pour(on){ if (pourG) pourG.gain.setTargetAtTime(on ? .35 : 0, ac.currentTime, .04); },
    plop(){ tone(320,.12,'sine',.25,0,110); },
    tick(){ tone(900,.05,'triangle',.12); },
    ready(){ tone(660,.09,'triangle',.16); tone(990,.12,'triangle',.14,.08); },
    ding(){ tone(1046,.12,'sine',.2); tone(1568,.2,'sine',.18,.09); },
    cash(){ tone(1318,.07,'square',.08); tone(1760,.16,'square',.08,.07); tone(2093,.2,'sine',.12,.14); },
    buzz(){ tone(150,.38,'sawtooth',.2,0,90); },
    meh(){ tone(520,.12,'triangle',.14); tone(440,.18,'triangle',.12,.1); },
    win(){ [523,659,784,1046,1318].forEach((f,i)=>tone(f,.25,'triangle',.18,i*.11)); },
    lose(){ [392,330,262,196].forEach((f,i)=>tone(f,.3,'sawtooth',.12,i*.18)); },
    chime(){ tone(1046,.14,'triangle',.2); tone(1318,.14,'triangle',.2,.11); tone(1568,.3,'triangle',.22,.22); },
    bgmStart(){ if (!ac) return; bgm.on = true; bgm.step = 0; bgm.next = ac.currentTime + .1; },
    bgmStop(){ bgm.on = false; },
    bgmTick(bpm){
      if (!ac || !bgm.on) return;
      const step = 60 / bpm / 2;
      while (bgm.next < ac.currentTime + .15){
        const i = bgm.step % 32, when = bgm.next - ac.currentTime;
        const m = MELODY[i];
        if (m) tone(midi(m), step*.9, 'square', .035, when);
        if (i % 4 === 0){
          const root = BASS[Math.floor(i/8)];
          tone(midi(i % 8 === 0 ? root : root + 7), step*1.6, 'triangle', .1, when);
        }
        if (i % 2 === 1) tone(5000, .02, 'square', .012, when);   // 鍋鏟敲擊感
        bgm.next += step; bgm.step++;
      }
    },
  };
})();

function newOrder(o={}){
  const order = o.order || genOrder(S.gt);
  const maxP = o.patience || (lerp(36, 24, S.gt/GAME_LEN) + order.length*8);
  S.spawned++;
  return {
    id:++S.cid, where: rand()<.5 ? '內用' : '外帶',
    order, done:order.map(()=>false), p:maxP, maxP, earned:0,
    type:o.type||'normal', hidden:!!o.hidden, free:false, greeted:false, changeAt:null,
  };
}
function spawn(c){ S.queue.push(c); renderTicket(); }

function onFirstChanged(){
  const c = S.queue[0];
  if (!c || c.greeted) return;
  c.greeted = true;
  sfx.chime();
  const tk = $('#ticket'); tk.classList.remove('pop'); void tk.offsetWidth; tk.classList.add('pop');
  if (c.type === 'uncle' && !c.hidden) setTimeout(()=>custSay('常客阿伯：記住我點什麼喔！'), 600);
  else if (S.gt > 80 && c.order.some((o,i)=>!c.done[i] && o.kind==='main' && o.tops.length < 3) && rand() < .22)
    c.changeAt = S.gt + rnd(3, 7);
}

function orderTimeout(c){
  S.queue.splice(S.queue.indexOf(c), 1);
  S.spawnT = 1;
  mistake('leave', pickAny(LINES.leave), '超時了，這單沒了');
  renderTicket();
}

function completeOrder(c){
  S.served++;
  if (c.free) S.freeCount++;
  else if (c.p/c.maxP > .5) setTimeout(()=>earn(10, '小費'), 300);
  S.queue.shift();
  S.spawnT = .6;
  sfx.cash();
  bossSay(c.free ? '這單請客了…' : '出餐完成！');
  renderHUD(); renderTicket();
  if (S.served >= GOAL) endGame(true);
}

/* 出餐：交給目前這張單 */
function deliver(item){
  const c = S.queue[0];
  if (!c){ toast('還沒有訂單喔～'); return false; }
  let best = -1, kind = null;
  c.order.forEach((o,i)=>{
    if (c.done[i]) return;
    const r = compare(o, item);
    if (r === 'exact' && kind !== 'exact'){ best = i; kind = r; }
    else if (r === 'over' && !kind){ best = i; kind = r; }
  });
  if (best >= 0){
    const want = c.order[best];
    c.done[best] = true; sfx.ding();
    if (c.free) lose(costOf(item), '請客');
    else {
      c.earned += want.price; earn(want.price);
      if (kind === 'over'){
        const extra = item.price - want.price;
        setTimeout(()=>lose(extra, '給太多'), 250);
        sfx.meh();
        toast(want.kind === 'drink' ? `做成大杯，只能收中杯的錢` : `多加了料，只能收原本的錢`);
      }
    }
    if (c.done.every(Boolean)) completeOrder(c); else renderTicket();
    return true;
  }
  // 送錯或少給
  const sameType = c.order.some((o,i)=>!c.done[i] && o.type === item.type);
  let line;
  if (item.kind === 'drink' && sameType) line = pickAny(LINES.wrongDrink);
  else line = pickAny(sameType ? LINES.wrongDetail : LINES.wrongItem);
  let sub = '這單就請客吧';
  if (!c.free && c.earned){ S.income -= c.earned; S.loss += c.earned; sub = `這單改請客（退 $${c.earned}）`; c.earned = 0; }
  c.free = true;
  S.loss += costOf(item);
  renderLedger();
  const tk = $('#ticket'); tk.classList.remove('mad'); void tk.offsetWidth; tk.classList.add('mad');
  mistake('wrong', line, sub);
  renderTicket();
  return true;
}

/* ================= 失誤 ================= */
let oopsT;
function oops(kind, line, sub){
  const o = $('#oops');
  o.querySelector('.oe').textContent = OOPS_EMOJI[kind] || '🥲';
  o.querySelector('.ol').textContent = line;
  o.querySelector('.os').textContent = sub || '';
  o.classList.remove('show','hide'); void o.offsetWidth; o.classList.add('show');
  clearTimeout(oopsT);
  oopsT = setTimeout(()=>{ o.classList.remove('show'); o.classList.add('hide'); }, 1700);
}
function mistake(kind, line, sub){
  if (S.over) return;
  S.lives--; S.mistakes++; S.lastFail = kind;
  sfx.buzz();
  if (navigator.vibrate) try { navigator.vibrate([80,40,80]); } catch(e){}
  const f = $('#flash'); f.classList.remove('on'); void f.offsetWidth; f.classList.add('on');
  oops(kind, line, (sub ? sub + '　' : '') + `🍳 剩 ${Math.max(0,S.lives)} 次`);
  renderHUD();
  if (S.lives <= 0) setTimeout(()=>endGame(false), 700);
}

/* ================= 煎台 ================= */
function placeGrill(type, el){
  const i = S.slots.findIndex(s=>!s);
  if (i < 0){ toast('煎台滿了！'); shakeEl($('#grill')); return; }
  const cat = MAINS[type] ? 'main' : SIDES[type] ? 'side' : 'fill';
  S.slots[i] = {type, cat, tops:[], t:0, state:'cook', born:++S.born, clearIn:0};
  if (cat !== 'fill' && (type === 'egg_pancake' || type === 'noodle')) S.sel = {w:'g', i};
  sfx.plop(); renderSlot(i); renderSel();
}
function slotItem(s){ return s.cat === 'main' ? makeItem('main', s.type, s.tops) : makeItem('side', s.type, s.tops); }
function tapSlot(i){
  const s = S.slots[i]; if (!s) return;
  if (s.state === 'burnt'){ clearSlot(i); return; }
  if (s.cat === 'fill'){
    if (s.state !== 'ready'){ toast(`${ING[s.type].name}還沒熟`); return; }
    if (addIng(s.type, null, i)) clearSlot(i);
    return;
  }
  if (s.state === 'ready'){ if (deliver(slotItem(s))) clearSlot(i); return; }
  if (s.type === 'egg_pancake' || s.type === 'noodle'){ S.sel = {w:'g', i}; renderSel(); sfx.tick(); }
}
function tossSlot(i){
  const s = S.slots[i]; if (!s) return;
  if (s.state !== 'burnt') lose(costOf(s.cat === 'fill' ? {price:ING[s.type].price} : slotItem(s)), '丟掉');
  clearSlot(i);
}
function clearSlot(i){ S.slots[i] = null; if (S.sel && S.sel.w==='g' && S.sel.i===i) S.sel = null; renderSlot(i); renderSel(); }

/* ================= 工作台（三明治、漢堡、飯糰） ================= */
function placeBase(type){
  const i = S.board.findIndex(b=>!b);
  if (i < 0){ toast('工作台滿了！先送出或丟掉'); shakeEl($('#boards')); return; }
  S.board[i] = {type, tops:[], born:++S.born};
  S.sel = {w:'b', i};
  sfx.plop(); renderBoard(i); renderSel();
}
function sendBoard(i){
  const b = S.board[i]; if (!b) return;
  if (deliver(makeItem('main', b.type, b.tops))){ S.board[i] = null; if (S.sel && S.sel.w==='b' && S.sel.i===i) S.sel = null; renderBoard(i); renderSel(); }
}
function tossBoard(i){
  const b = S.board[i]; if (!b) return;
  lose(costOf(makeItem('main', b.type, b.tops)), '丟掉');
  S.board[i] = null; if (S.sel && S.sel.w==='b' && S.sel.i===i) S.sel = null; renderBoard(i); renderSel();
}

/* ================= 加料：加到選取的那份（蛋餅、鐵板麵、工作台） ================= */
function targetOf(ref){
  if (!ref) return null;
  const x = ref.w === 'g' ? S.slots[ref.i] : S.board[ref.i];
  if (!x) return null;
  if (ref.w === 'g' && (x.cat !== 'main' && x.type !== 'noodle' || x.state === 'burnt')) return null;
  return x;
}
function accepts(x, id){
  if (ING[id].sauce) return x.type === 'noodle';
  return !!MAINS[x.type] && MAINS[x.type].fill.includes(id);
}
function addIng(id, el){
  let ref = S.sel, x = targetOf(ref);
  if (!x || !accepts(x, id)){
    ref = null; let bestBorn = -1;
    const consider = (w, i) => { const r = {w, i}, y = targetOf(r); if (y && accepts(y, id) && !y.tops.includes(id) && y.born > bestBorn){ ref = r; bestBorn = y.born; } };
    S.slots.forEach((_,i)=>consider('g', i)); S.board.forEach((_,i)=>consider('b', i));
    x = targetOf(ref);
  }
  const N = ING[id].name;
  if (!x){
    const where = ING[id].sauce ? '鐵板麵' : Object.values(MAINS).filter(m=>m.fill.includes(id)).map(m=>m.name).join('、');
    toast(`${N}可以加在：${where}`); shakeEl(el); return false;
  }
  if (ING[id].sauce) x.tops = [id];
  else { if (x.tops.includes(id)){ toast(`已經加過${N}了`); return false; } x.tops.push(id); }
  S.sel = ref; sfx.tick();
  if (ref.w === 'g') renderSlot(ref.i); else renderBoard(ref.i);
  renderSel();
  return true;
}

/* ================= 飲料 ================= */
function sizeOf(level){
  for (const k in SIZES) if (level >= SIZES[k].lo && level <= SIZES[k].hi) return k;
  return 'X';
}
function serveCup(i){
  const c = S.cups[i];
  if (c.level < 3 || c.pouring) return;
  if (deliver(makeItem('drink', c.type, [], sizeOf(c.level)))){ c.level = 0; renderCup(i); }
}

/* ================= 主迴圈 ================= */
let last = 0;
function loop(ts){
  const dt = Math.min(.05, (ts - last)/1000 || 0); last = ts;
  if (S.running && !S.paused && !S.over) update(dt);
  requestAnimationFrame(loop);
}
function update(dt){
  S.gt += dt;
  const t = S.gt, E = S.events, P = S.pending;

  if (!E.uncle1 && S.spawned >= 2){ E.uncle1 = true; P.push(newOrder({type:'uncle', order:UNCLE_ORDER(), patience:55})); }
  if (!E.uncle2 && t > 125){ E.uncle2 = true; P.push(newOrder({type:'uncle', order:UNCLE_ORDER(), patience:50, hidden:true})); }
  if (!E.uncle3 && t > 235){ E.uncle3 = true; P.push(newOrder({type:'uncle', order:UNCLE_ORDER(), patience:46, hidden:true})); }
  if (!E.deliv1 && t > 150){ E.deliv1 = true; P.push(newOrder({type:'delivery', order:genOrder(t,4), patience:62})); }
  if (!E.deliv2 && t > 250){ E.deliv2 = true; P.push(newOrder({type:'delivery', order:genOrder(t,4), patience:58})); }
  if (!E.rush && t > 200){ E.rush = true; toast('上班上課尖峰！訂單變大了'); }

  // 一次一張單，完成才出下一張
  if (!S.queue.length){
    S.spawnT -= dt;
    if (S.spawnT <= 0){
      const c = P.shift() || newOrder();
      if (c.type === 'delivery') toast('外送單！一次 4 樣！');
      spawn(c);
    }
  }
  for (const c of S.queue.slice()){
    c.p -= dt;
    if (c.p <= 0){ orderTimeout(c); if (S.over) return; }
  }
  // 改單
  const f = S.queue[0];
  if (f && f.changeAt && t >= f.changeAt){
    f.changeAt = null;
    const idx = f.order.findIndex((o,i)=>!f.done[i] && o.kind==='main' && o.tops.length < 3);
    if (idx >= 0){
      const o = f.order[idx];
      const add = MAINS[o.type].fill.filter(x=>!o.tops.includes(x));
      const top = pick(add);
      f.order[idx] = makeItem('main', o.type, o.tops.concat(top));
      f.order[idx].changed = true;
      custSay(`改單！${MAINS[o.type].name}加${ING[top].name}！`); sfx.tick();
      renderTicket();
    }
  }
  if (S.queue[0] !== S.lastFirst){ S.lastFirst = S.queue[0]; onFirstChanged(); }

  // 煎台
  const win = lerp(6, 4, t/GAME_LEN);
  let cooking = 0;
  S.slots.forEach((s,i)=>{
    if (!s) return;
    s.t += dt;
    const cook = cookOf(s.type);
    if (s.state === 'cook' && s.t >= cook){ s.state = 'ready'; sfx.ready(); renderSlot(i); }
    if (s.state === 'ready' && s.t >= cook + win){
      s.state = 'burnt'; s.clearIn = 1.6;
      lose(costOf(s.cat === 'fill' ? {price:ING[s.type].price} : slotItem(s)), '燒焦');
      mistake('burnt', pickAny(LINES.burnt), `${nameOf(s.type)}煎過頭了`);
      renderSlot(i);
    }
    if (s.state === 'burnt'){ s.clearIn -= dt; if (s.clearIn <= 0){ clearSlot(i); return; } }
    else cooking++;
    paintSlot(i, s, cook, win);
  });
  sfx.sizzle(cooking);
  $('#grill').classList.toggle('hot', cooking > 0);

  // 飲料
  let pouring = false;
  S.cups.forEach((c,i)=>{
    if (!c.pouring) return;
    pouring = true;
    c.level += dt * lerp(40, 52, t/GAME_LEN);
    if (c.level >= 100){
      c.level = 0; c.pouring = false; c.pid = null;
      const el = cupEls[i].cup; el.classList.remove('spill'); void el.offsetWidth; el.classList.add('spill');
      lose(10, '溢出');
      mistake('spill', pickAny(LINES.spill), `${DRINKS[c.type].name}倒太滿了`);
    }
    renderCup(i);
  });
  sfx.pour(pouring);
  sfx.bgmTick(lerp(118, 158, t/GAME_LEN));

  paintPatience();
  renderTimer();
  if (t >= GAME_LEN && !S.over) endGame(false, 'timeup');
}

function renderSlot(i){

function paintSlot(i, s, cook, win){
  const E = slotEls[i];
  if (s.state === 'cook'){
    const p = s.t / cook;
    E.food.style.filter = `brightness(${1.3-.3*p}) saturate(${.3+.7*p})`;
    E.ring.style.setProperty('--p', p.toFixed(3)); E.ring.style.setProperty('--rc', 'var(--yolk)');
  } else if (s.state === 'ready'){
    const q = (s.t - cook) / win;
    E.food.style.filter = `brightness(${1-.35*q}) saturate(${1+.3*q})`;
    E.ring.style.setProperty('--p', (1-q).toFixed(3));
    E.ring.style.setProperty('--rc', q > .6 ? 'var(--tomato)' : 'var(--scallion)');
    E.el.classList.add('ready'); E.el.classList.toggle('warn', q > .6);
  } else {
    E.food.style.filter = 'brightness(.25) saturate(.2)';
    E.ring.style.setProperty('--p', 1); E.ring.style.setProperty('--rc', '#111');
    E.el.classList.remove('ready','warn'); E.smoke.classList.add('on');
  }
}

function whoOf(c){ return c.type==='delivery' ? '外送單' : c.type==='uncle' ? '常客阿伯' : c.where; }

function bump(el){ el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }

}
function renderTimer(){
  const left = Math.max(0, GAME_LEN - S.gt), m = Math.floor(left/60), s = Math.floor(left%60);
  const el = $('#timer'); el.textContent = `${m}:${String(s).padStart(2,'0')}`;
  el.classList.toggle('hurry', left < 30);
}

/* ---------- 提示 ---------- */
let toastT, bossT, custT, floatN = 0;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove('show'), 1400); }
function bossSay(msg){ const b = $('#bossSay'); b.textContent = msg; b.classList.add('show'); clearTimeout(bossT); bossT = setTimeout(()=>b.classList.remove('show'), 1800); }
function custSay(msg){ const b = $('#custSay'); b.textContent = msg; b.classList.add('show'); clearTimeout(custT); custT = setTimeout(()=>b.classList.remove('show'), 2400); }
function floater(text, bad){
  const f = document.createElement('div'); f.className = 'floater' + (bad ? ' bad' : ''); f.textContent = text;
  f.style.right = '20px'; f.style.top = (70 + (floatN++ % 3) * 22) + 'px';
  $('#app').appendChild(f); setTimeout(()=>f.remove(), 1100);
}
function shakeEl(el){ if (!el) return; el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }

/* ================= 觸控（每根手指各自處理，可以多指同時操作） ================= */
document.addEventListener('pointerdown', e => {
  const el = e.target.closest('[data-act]');
  if (!el || !S.running || S.paused || S.over) return;
  e.preventDefault();
  sfx.init();
  const a = el.dataset.act, v = el.dataset.v;
  if (el.classList.contains('ing')){ el.classList.add('press'); setTimeout(()=>el.classList.remove('press'), 90); }
  switch(a){
    case 'grill': placeGrill(v, el); break;
    case 'base': placeBase(v); break;
    case 'ing': addIng(v, el); break;
    case 'slot': tapSlot(+v); break;
    case 'toss': tossSlot(+v); break;
    case 'board': if (S.board[+v]){ S.sel = {w:'b', i:+v}; renderSel(); sfx.tick(); } break;
    case 'bsend': sendBoard(+v); break;
    case 'btoss': tossBoard(+v); break;
    case 'send': serveCup(+v); break;
    case 'dump': { const c = S.cups[+v]; if (c.level >= 3) lose(5, '倒掉'); c.level = 0; renderCup(+v); break; }
    case 'pour': { const c = S.cups[+v]; c.pouring = true; c.pid = e.pointerId; renderCup(+v); break; }
    case 'peek': {
      const c = S.queue[0]; if (!c) break;
      c.hidden = false; c.p -= c.maxP * .25; S.peeks++;
      custSay(pickAny(LINES.peek)); renderTicket(); break;
    }
  }
}, {passive:false});
function stopPour(e){
  S && S.cups.forEach((c,i)=>{ if (c.pouring && c.pid === e.pointerId){ c.pouring = false; c.pid = null; renderCup(i); } });
}
['pointerup','pointercancel'].forEach(ev=>document.addEventListener(ev, stopPour));
document.addEventListener('contextmenu', e=>e.preventDefault());

/* ================= 開始 / 暫停 / 結束 ================= */
function showCard(html){ $('#card').innerHTML = html; $('#overlay').hidden = false; }
function hideCard(){ $('#overlay').hidden = true; }

function esc(s){ return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function startScreen(){
  showCard(`
    <h1>今天要開什麼店？</h1>
    <div class="namerow">
      <input id="shopName" maxlength="10" value="${esc(shopName)}" aria-label="店名" autocomplete="off">
      <button id="dice" aria-label="隨機店名">🎲</button>
    </div>
    <p class="big">五分鐘出完 <b>20 張單</b>，看今天淨賺多少！</p>
    <ul>
      <li><b>蛋餅</b>：放蛋餅皮上煎台，再點料加上去，煎好點一下出餐</li>
      <li><b>三明治、漢堡、飯糰</b>：放到工作台，加料後按「送」</li>
      <li>有 🔥 的料要先煎，熟了點一下就夾去配</li>
      <li><b>按住杯子</b>倒飲料，停在中杯或大杯的線之間</li>
      <li>給多了（中杯做成大杯、多加料）只收原本的錢；<b>給少了就變免費</b></li>
      <li>送錯、燒焦、溢出、超時 <b>3 次就倒店</b></li>
    </ul>
    <button class="cta" id="startBtn">開店！</button>`);
  const input = $('#shopName');
  input.addEventListener('pointerdown', e=>e.stopPropagation());
  $('#dice').onclick = () => {
    const d = $('#dice'); d.classList.remove('roll'); void d.offsetWidth; d.classList.add('roll');
    sfx.init();
    let n = 0;
    const iv = setInterval(()=>{
      let next; do { next = pickAny(SHOP_NAMES); } while (next === input.value && SHOP_NAMES.length > 1);
      input.value = next; sfx.tick();
      if (++n >= 8){ clearInterval(iv); sfx.ding(); }
    }, 60);
  };
  $('#startBtn').onclick = () => { setShopName(input.value); startGame(); };
}
function startGame(){
  sfx.init();
  S = freshState(); seed = (Date.now() ^ 0x5f3759df) >>> 0;
  S.running = true;
  sfx.bgmStart();
  S.slots.forEach((_,i)=>renderSlot(i)); S.board.forEach((_,i)=>renderBoard(i)); S.cups.forEach((_,i)=>renderCup(i));
  renderSel(); renderHUD(); renderTicket(); renderTimer(); renderLedger();
  hideCard();
}
function pause(on){
  if (!S || !S.running || S.over) return;
  S.paused = on;
  sfx.sizzle(0); sfx.pour(false);
  if (on) sfx.bgmStop(); else sfx.bgmStart();
  S.cups.forEach((c,i)=>{ c.pouring = false; renderCup(i); });
  if (on){
    showCard(`<h2>休息一下</h2><p>煎台先關火，訂單也會等你。</p><button class="cta" id="resumeBtn">繼續營業</button><button class="ghostbtn" id="quitBtn">不開了，重新來</button>`);
    $('#resumeBtn').onclick = ()=>pause(false);
    $('#quitBtn').onclick = ()=>{ S.over = true; sfx.bgmStop(); startScreen(); };
  } else hideCard();
}
function getTitle(){
  const used = S.gt, m = S.mistakes, net = S.income - S.loss;
  if (net < 0) return ['佛心做功德老闆','今天淨賺是負的，土地公有記下來了。'];
  if (m === 0 && used < 210) return ['早餐界米其林三星','評審吃完蛋餅當場落淚，說這是他阿嬤的味道。'];
  if (m === 0) return ['零失誤煎台之神','煎台看到你都自動降溫三度表示尊敬。'];
  if (net >= 1500) return ['早餐店股神','今天賺的錢夠再開一間分店。'];
  if (used < 190) return ['蛋餅閃電俠','客人「我要…」還沒講完，你已經出餐了。'];
  if (S.loss >= 200) return ['料多實在大慈善家','客人都說你家料給很大方，會計在哭。'];
  if (S.peeks >= 2) return ['阿伯老樣子翻譯機','阿伯說你比他兒子還懂他。'];
  if (m === 2) return ['九命怪貓店長','差點倒店，但店裡的貓保佑你活下來了。'];
  return ['帥哥美女早安認證店長','你的「早安」比你的蛋餅還有名。'];
}
function endGame(win, reason){
  if (S.over) return;
  S.over = true; S.running = false;
  sfx.sizzle(0); sfx.pour(false); sfx.bgmStop();
  const mm = Math.floor(S.gt/60), ss = String(Math.floor(S.gt%60)).padStart(2,'0');
  const net = S.income - S.loss;
  const books = `<div class="books"><div>收入<b>$${S.income}</b></div><div>賠掉<b>$${S.loss}</b></div><div>淨賺<b style="color:${net<0?'var(--tomato)':'var(--scallion)'}">${net<0?'-':''}$${Math.abs(net)}</b></div></div>`;
  const stats = `<div class="stat"><span>出餐 ${S.served}/${GOAL}</span><span>用時 ${mm}:${ss}</span><span>失誤 ${S.mistakes}</span></div>`;
  if (win){
    const [title, quip] = getTitle();
    sfx.win();
    showCard(`<h2>「${esc(shopName)}」過關！</h2><p>老闆獲得封號</p><div class="titleBadge">${title}</div><p class="big">${quip}</p>${books}${stats}<button class="cta" id="againBtn">明天再開店</button><button class="ghostbtn" id="renameBtn">換個店名</button>`);
  } else {
    const k = reason || S.lastFail;
    const line = pickAny(FAIL[k] || FAIL.wrong);
    sfx.lose();
    showCard(`<h2>「${esc(shopName)}」${k==='timeup'?'打烊了…':'倒店了…'}</h2><p class="big">${line}</p>${books}${stats}<button class="cta" id="againBtn">不服，再來</button><button class="ghostbtn" id="renameBtn">換個店名重開</button>`);
  }
  $('#againBtn').onclick = startGame;
  $('#renameBtn').onclick = startScreen;
}

$('#pauseBtn').onclick = () => pause(!(S && S.paused));
$('#muteBtn').onclick = () => {
  soundOn = !soundOn; sfx.mute(soundOn);
  $('#muteBtn').textContent = soundOn ? '🔊' : '🔇';
};
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(true); });

/* ================= 啟動 ================= */
S = freshState();
setShopName(shopName);
buildKitchen();
S.slots.forEach((_,i)=>renderSlot(i)); S.board.forEach((_,i)=>renderBoard(i)); S.cups.forEach((_,i)=>renderCup(i));
renderHUD(); renderTicket(); renderTimer(); renderLedger();
startScreen();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
